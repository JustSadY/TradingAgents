global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tradingagents
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/prometheus-metrics-token
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: tradingagents

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
