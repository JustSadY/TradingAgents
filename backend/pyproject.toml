[project]
name = "tradingagents-backend"
version = "0.1.0"
description = "TradingAgents FastAPI backend"
readme = "../README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "httpcore>=1.0.0,<2.0",
    "websockets>=14.0",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pyjwt>=2.10.0",
    "tenacity>=9.0.0",
    "pwdlib[argon2]>=0.3.0",
    "cryptography>=44.0.0",
    "pydantic>=2.0.0,<3.0",
    "pydantic-settings>=2.0.0,<3.0",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.0",
    "redis>=5.0,<7.0",
    "arq>=0.26,<0.27",
    "langchain-core>=0.3.81,<2.0",
    "langchain-experimental>=0.3.4,<1.0",
    "langchain-litellm>=0.7.0,<1.0",
    "langgraph>=1.0.0,<2.0",
    "langgraph-checkpoint-postgres>=2.0.0,<4.0",
    "psycopg[binary,pool]>=3.2.0",
    "pinecone>=5.0.0",
    "alpaca-py>=0.43.5,<1.0",
    "pandas-ta-classic>=0.6.52,<1.0",
    "pandas>=2.3.0",
    "numpy>=2.0.0",
    "yfinance>=0.2.63",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.9.0",
    "lxml>=5.0.0",
    "prometheus-client>=0.20.0",
    "pytz>=2025.2",
    "python-dateutil>=2.8.2",
    "setuptools>=80.9.0",
    "typing-extensions>=4.14.0",
    "aiosqlite",
    "exchange-calendars>=4.5,<6.0",
    "diskcache>=5.6,<6.0",
    "aiolimiter>=1.1,<2.0",
    "cachetools>=5.5,<7.0",
    "arch>=8.0,<9.0",
    "optuna>=4.0,<5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]
research = [
    "openbb>=4.7.2,<5.0",
    "TA-Lib>=0.7.1,<1.0",
    "vectorbt>=1.1.0,<2.0",
    "empyrical-reloaded>=0.5.12,<1.0",
    "quantstats>=0.0.81,<1.0",
    "pyportfolioopt>=1.6.0,<2.0",
]
observability = [
    "opentelemetry-sdk>=1.44.0,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.64b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.64b0,<1.0",
    "langfuse>=4.0.0,<5.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP"]
ignore = ["B008", "C901", "E501", "E402", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require external services)",
    "llm: marks tests that call LLM endpoints",
    "postgres_rls: PostgreSQL integration tests for runtime RLS contexts",
]
addopts = "-q --tb=short --strict-markers"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["core/temporal.py", "schemas"]
exclude = ["tests", "postgres_tests"]
extraPaths = [".."]
reportMissingImports = "warning"
reportGeneralTypeIssues = "warning"
reportMissingTypeStubs = "none"
