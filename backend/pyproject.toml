[project]
name = "tradingagents-backend"
version = "0.1.0"
description = "TradingAgents FastAPI backend"
readme = "../README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "httpcore>=1.0.0,<2.0",
    "websockets>=14.0",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "cryptography>=44.0.0",
    "pydantic>=2.0.0,<3.0",
    "pydantic-settings>=2.0.0,<3.0",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.0",
    "redis>=5.0,<7.0",
    "arq>=0.26,<0.27",
    "langchain-core>=0.3.81,<2.0",
    "langchain-anthropic>=0.3.15,<2.0",
    "langchain-experimental>=0.3.4,<1.0",
    "langchain-google-genai>=4.0.0,<5.0",
    "langchain-openai>=0.3.23,<2.0",
    "langchain-mistralai>=1.1.0,<2.0",
    "langchain-groq>=1.1.0,<2.0",
    "langgraph>=1.0.0,<2.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<4.0",
    "langgraph-checkpoint-postgres>=2.0.0,<4.0",
    "psycopg[binary,pool]>=3.2.0",
    "pinecone>=5.0.0",
    "pandas>=2.3.0",
    "numpy>=2.0.0",
    "yfinance>=0.2.63",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.9.0",
    "lxml>=5.0.0",
    "prometheus-client>=0.20.0",
    "requests>=2.32.4",
    "pytz>=2025.2",
    "python-dateutil>=2.8.2",
    "setuptools>=80.9.0",
    "typing-extensions>=4.14.0",
    "aiosqlite",
]

# Test and lint tooling is deliberately kept out of [project.dependencies] so
# the production image and deploy venvs do not ship it. CI installs it with
# `uv sync` (which includes dev groups by default).
[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.uv]
# The importable package is the repository root's `backend` package, not this
# directory as a distribution, so uv manages dependencies only and never tries
# to build/install the project itself.
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008", # FastAPI Depends calls in defaults
    "C901", # legacy orchestrators are tracked for staged decomposition
    "E501", # line too long
    "E402", # module level import not at top of file
    # UP042 wants `class X(str, Enum)` rewritten to `StrEnum`, which changes what
    # str()/f-string interpolation produces ("X.BUY" -> "Buy"). These enums are
    # serialized into prompts, stored decisions and API payloads, so the rewrite
    # is a behaviour change that needs a per-enum audit rather than a lint pass.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require external services)",
    "llm: marks tests that call LLM endpoints",
]
addopts = "-q --tb=short --strict-markers"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*"]


[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["backend/core/temporal.py", "backend/schemas"]
exclude = ["backend/tests"]
reportMissingImports = "warning"
reportGeneralTypeIssues = "warning"
reportMissingTypeStubs = "none"
