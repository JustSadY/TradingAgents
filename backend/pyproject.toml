[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008", # do not perform function calls in argument defaults (common in FastAPI Depends)
    "C901", # too complex
    "E501", # line too long
    "E402", # module level import not at top of file
    "UP042", # StrEnum requires Python 3.11; project supports 3.10
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require external services)",
    "llm: marks tests that call LLM endpoints",
]
addopts = "-q --tb=short --strict-markers"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/trading_agents/*"]

