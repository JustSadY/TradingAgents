services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradingagents
      POSTGRES_USER: tradingagents
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingagents"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tradingagents-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-prepare:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: tradingagents
      PGUSER: tradingagents
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_RUNTIME_USER: tradingagents_app
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Set DB_RUNTIME_PASSWORD in .env}
    volumes:
      - ./deploy/docker-db-prepare.sh:/usr/local/bin/docker-db-prepare.sh:ro
    command: ["/bin/sh", "/usr/local/bin/docker-db-prepare.sh"]
    networks:
      - tradingagents-net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      db-prepare:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://tradingagents_app:${DB_RUNTIME_PASSWORD:?Set DB_RUNTIME_PASSWORD in .env}@postgres:5432/tradingagents
      MIGRATION_DATABASE_URL: postgresql+asyncpg://tradingagents:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/tradingagents
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    networks:
      - tradingagents-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tradingagents-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      RLS_STRICT_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://tradingagents_app:${DB_RUNTIME_PASSWORD:?Set DB_RUNTIME_PASSWORD in .env}@postgres:5432/tradingagents
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_URL: redis://redis:6379/0
      ANALYSIS_QUEUE_MODE: worker
      METRICS_TOKEN: ${METRICS_TOKEN}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Frontend Nginx is the only public proxy. It overwrites X-Forwarded-For
      # with its immediate client address; accept that header only from the
      # private Docker bridge range, never from an exposed backend caller.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12,fd00::/8}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Keep direct backend access local for Swagger/debugging. Public traffic
      # must traverse frontend Nginx so rate-limit identity cannot be forged.
      - "127.0.0.1:8000:8000"
    volumes:
      - tradingagents_data:/root/.tradingagents
    networks:
      - tradingagents-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    healthcheck:
      disable: true
    command: ["arq", "backend.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      RLS_STRICT_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://tradingagents_app:${DB_RUNTIME_PASSWORD:?Set DB_RUNTIME_PASSWORD in .env}@postgres:5432/tradingagents
      REDIS_URL: redis://redis:6379/0
      ANALYSIS_QUEUE_MODE: worker
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tradingagents_data:/root/.tradingagents
    networks:
      - tradingagents-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.frontend
      args:
        # Optional externally reachable URL used when copying public share
        # links (for example https://trading.example.com).  Leave empty to
        # derive the link from the browser's current origin.
        VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tradingagents-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Monitoring Stack ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    # Prometheus does not support --config.expand-env.  Write the optional
    # scrape credential to a container-local file instead of interpolating it
    # into the mounted config (and therefore never persist it in the repo).
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf '%s' "$${METRICS_TOKEN:-}" > /tmp/prometheus-metrics-token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.console.libraries=/etc/prometheus/console_libraries \
          --web.console.templates=/etc/prometheus/consoles \
          --web.enable-lifecycle
    ports:
      # Monitoring UIs are operator-only.  Put a reverse proxy/VPN in front of
      # them if remote access is required; never publish them on every host
      # interface by default.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tradingagents-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      - GF_INSTALL_PLUGINS=
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - tradingagents-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    # The exporter looks for this optional file by default. Supply an explicit
    # empty configuration so its built-in collectors remain enabled without a
    # misleading missing-file warning at startup.
    command: ["--config.file=/etc/postgres-exporter/postgres_exporter.yml"]
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-tradingagents}:${DB_PASSWORD:-tradingagents}@postgres:5432/${DB_NAME:-tradingagents}?sslmode=disable"
    volumes:
      - ./monitoring/postgres-exporter:/etc/postgres-exporter:ro
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tradingagents-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379/0
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tradingagents-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  tradingagents_data:
  prometheus_data:
  grafana_data:

networks:
  tradingagents-net:
    driver: bridge
