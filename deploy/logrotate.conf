# TradingAgents — logrotate configuration
#
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/tradingagents
#
# Backend application logs (written by the backend to TRADINGAGENTS_LOG_DIR)
# These are rotated daily with compression and kept for 30 days.
/var/log/tradingagents/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
}

# Nginx access and error logs (Docker or bare-metal)
/var/log/nginx/tradingagents_*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    postrotate
        systemctl reload nginx > /dev/null 2>&1 || true
    endscript
}
