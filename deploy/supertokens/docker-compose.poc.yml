# SuperTokens core for the PoC — see docs/poc/supertokens.md
#
# Run alongside the main stack:
#
#     docker compose -f docker-compose.yml -f deploy/supertokens/docker-compose.poc.yml up -d
#
# This file is the operational cost of the design, stated plainly: one more
# service to run, monitor, back up and upgrade, holding the half of user
# identity the application database does not.
#
# The core keeps its own tables. Pointing it at the application's PostgreSQL
# puts them in the same backup, which is the lesser of two bad options — the
# alternative is a second database whose restore has to be kept consistent with
# the first. They are still two stores either way: no transaction spans them,
# so creating or deleting a user is two writes that can half-fail.

services:
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:11.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://tradingagents:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/tradingagents
      # Keeps SuperTokens' tables out of the application's namespace, so
      # `alembic check` and the drift test do not see them as tables to drop.
      POSTGRESQL_TABLE_SCHEMA: supertokens
      API_KEYS: ${SUPERTOKENS_API_KEY:?Set SUPERTOKENS_API_KEY in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 10
    # Deliberately not published. The core has no authentication beyond
    # API_KEYS and is not built to face the internet; only the backend and the
    # browser's own /auth/st path should reach it.
    expose:
      - "3567"
    networks:
      - tradingagents-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tradingagents-net:
    external: false
