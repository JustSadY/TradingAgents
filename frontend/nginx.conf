# Keep only failed WebSocket handshakes and use $uri, never $request, so an
# unexpected query value cannot be copied into access logs.
map $status $log_websocket_handshake {
    default 1;
    101     0;
}

log_format websocket_safe '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Mirror the backend's MAX_REQUEST_BODY_BYTES limit
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Proxy API and WebSocket to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Explicitly preserve the application and private auth protocols used
        # by the React client. Nginx normally forwards them, but making this
        # contractual prevents a proxy-header change from breaking auth.
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        # WebSocket frames should pass through immediately. Buffering can
        # delay small progress/heartbeat frames and makes abrupt upstream
        # disconnects harder for the browser to recover from.
        proxy_buffering off;
        proxy_request_buffering off;
        # Suppress successful 101 noise; failed handshakes retain a useful,
        # query-free diagnostic line via the format declared above.
        access_log /dev/stdout websocket_safe if=$log_websocket_handshake;
        # Uvicorn's --no-date-header eliminates the known duplicate-Date
        # warning at its source; this remains a defense-in-depth log boundary.
        error_log /dev/stderr error;
        # Analyses run for minutes; keep idle WebSockets alive
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build assets are immutable.
    # add_header in a location block discards inherited headers, so the
    # security headers must be repeated here.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
