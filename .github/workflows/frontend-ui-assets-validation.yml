name: Frontend UI assets validation

on:
  push:
    branches:
      - refactor/frontend-ui-assets

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-ui-assets
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies and refresh lockfile
        working-directory: frontend
        run: npm install

      - name: Persist package lock if dependencies changed
        shell: bash
        run: |
          if ! git diff --quiet -- frontend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "Update frontend dependency lockfile"
            git push origin HEAD:refactor/frontend-ui-assets
          fi

      - name: Install uv
        run: python -m pip install uv

      - name: Run frontend acceptance checks
        shell: bash
        run: |
          set +e
          cd frontend

          npm run lint
          LINT=$?

          npm test
          TEST=$?

          npm run build
          BUILD=$?

          npm run api:check
          API_CHECK=$?

          {
            echo "## Frontend UI assets validation"
            echo ""
            echo "| Check | Exit code |"
            echo "| --- | ---: |"
            echo "| npm run lint | $LINT |"
            echo "| npm test | $TEST |"
            echo "| npm run build | $BUILD |"
            echo "| npm run api:check | $API_CHECK |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$LINT" -ne 0 ] || [ "$TEST" -ne 0 ] || [ "$BUILD" -ne 0 ] || [ "$API_CHECK" -ne 0 ]; then
            exit 1
          fi
