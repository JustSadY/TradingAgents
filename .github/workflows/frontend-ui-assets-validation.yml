name: Frontend direct Axios inventory

on:
  push:
    branches:
      - refactor/frontend-ui-assets

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-ui-assets
      - name: Print remaining direct Axios files
        working-directory: frontend
        shell: bash
        run: |
          echo 'DIRECT_AXIOS_BEGIN'
          grep -RIlE 'axios\.(get|post|put|patch|delete)|axios\(' src --include='*.ts' --include='*.tsx' \
            | grep -v '/api/generated/' \
            | sort || true
          echo 'DIRECT_AXIOS_END'
