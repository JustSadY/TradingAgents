name: Legacy cleanup validation

on:
  push:
    branches:
      - agent/legacy-cleanup-pass4
    paths:
      - .github/workflows/legacy-cleanup-validate.yml
      - CLAUDE.md
      - backend/trading_agents/__init__.py
      - backend/trading_agents/agents/runtime/logging_config.py
      - backend/trading_agents/agents/main/risk.py
      - backend/trading_agents/agents/data/review_tools.py
      - backend/services/analysis/portfolio_orchestrator.py
      - backend/services/analysis/orchestrator.py
      - backend/services/analysis/config_builder.py
      - backend/services/notification_service.py
      - backend/services/settings_service.py
      - backend/alembic/versions/**
      - backend/tests/**
      - backend/postgres_tests/**
      - backend/api/trading.py
      - backend/api/auth.py
      - backend/api/alerts.py
      - backend/api/share.py
      - backend/api/settings.py
      - backend/api/users.py
      - backend/services/mock_trading_service.py
      - backend/services/auth_session_service.py
      - backend/services/alert_management_service.py
      - backend/repositories/refresh_sessions.py
      - backend/repositories/alerts.py
      - backend/core/database.py
      - backend/core/catalog.py
      - backend/core/password_hashing.py
      - backend/core/security.py
      - backend/models/analysis.py
      - backend/schemas/analysis.py
      - backend/schemas/share.py
      - backend/schemas/auth.py
      - backend/schemas/settings.py
      - backend/main.py
      - backend/worker.py
      - frontend/src/App.tsx
      - frontend/src/analysis/streamingReports.ts
      - frontend/src/analysis/portfolioDecision.ts
      - frontend/src/analysis/__tests__/streamingReports.test.ts
      - frontend/src/analysis/__tests__/portfolioDecision.test.ts
      - frontend/src/components/analysis/PortfolioDecisionCard.tsx
      - frontend/src/components/analysis/tabs/HistoryTab.tsx
      - frontend/src/pages/Analysis.tsx
      - frontend/src/pages/SharedReport.tsx
      - frontend/src/pages/__tests__/SharedReport.test.tsx
      - frontend/src/report/reportSections.ts
      - frontend/src/utils/__tests__/exportReport.test.ts
      - frontend/src/utils/__tests__/exportLabels.fixture.ts
      - frontend/src/contexts/AuthContext.tsx
      - frontend/src/contexts/__tests__/AuthContext.test.tsx
      - frontend/src/i18n/analysis.ts
      - frontend/src/i18n/export_sections.ts
      - frontend/src/api/generated/model/tokenResponse.ts

permissions:
  contents: read

jobs:
  validate-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reject legacy password facade imports
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          password_names = {
              "hash_password",
              "is_supported_password_hash",
              "verify_and_update_password",
              "verify_password",
          }
          hits = []
          for path in sorted(Path("backend").rglob("*.py")):
              if path.as_posix() == "backend/core/security.py":
                  continue
              try:
                  tree = ast.parse(path.read_text())
              except (SyntaxError, UnicodeDecodeError):
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module == "backend.core.security":
                      names = sorted({alias.name for alias in node.names} & password_names)
                      if names:
                          hits.append((path.as_posix(), node.lineno, names))
          if hits:
              for path, line, names in hits:
                  print(f"LEGACY_PASSWORD_FACADE {path}:{line} {','.join(names)}")
              raise SystemExit(f"legacy password facade imports remain: {len(hits)}")
          print("LEGACY_PASSWORD_FACADE_IMPORTS=0")
          PY

      - name: Reject import-time engine logging side effects
        shell: bash
        run: |
          uv run --project backend python - <<'PY'
          import logging
          import sys
          from pathlib import Path

          root = logging.getLogger()
          handlers_before = tuple(root.handlers)
          excepthook_before = sys.excepthook
          import backend.trading_agents  # noqa: F401

          if tuple(root.handlers) != handlers_before:
              raise SystemExit("import backend.trading_agents changed root logging handlers")
          if sys.excepthook is not excepthook_before:
              raise SystemExit("import backend.trading_agents changed sys.excepthook")

          web = Path("backend/main.py").read_text()
          worker = Path("backend/worker.py").read_text()
          package_init = Path("backend/trading_agents/__init__.py").read_text()
          if "setup_unified_logging()" not in web:
              raise SystemExit("web lifespan does not explicitly initialize engine logging")
          if "setup_unified_logging()" not in worker:
              raise SystemExit("worker startup does not explicitly initialize engine logging")
          if "setup_unified_logging" in package_init:
              raise SystemExit("engine package import still initializes logging")
          print("IMPORT_TIME_ENGINE_LOGGING=0")
          PY

      - name: Reject obsolete preferences route alias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("frontend/src/App.tsx").read_text()
          if 'path="preferences"' in app or 'path="/preferences"' in app:
              raise SystemExit("obsolete /preferences route alias still exists")
          if 'path="settings"' not in app:
              raise SystemExit("canonical /settings route is missing")
          print("PREFERENCES_ROUTE_ALIAS=0")
          PY

      - name: Reject retired Trader streaming aliases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          streaming = Path("frontend/src/analysis/streamingReports.ts").read_text()
          if "trader: 'trader_plan'" in streaming or 'trader: "trader_plan"' in streaming:
              raise SystemExit("retired Trader streaming alias still exists")
          print("TRADER_STREAMING_ALIAS=0")
          PY

      - name: Reject retired Trader production contract
        shell: bash
        run: |
          if git grep -n -E 'trader_plan|trader_proposal_json|trader_investment_plan' -- \
            backend frontend \
            ':!backend/alembic/versions/**' \
            ':!backend/tests/**' \
            ':!frontend/src/**/__tests__/**'; then
            echo 'retired Trader production contract was reintroduced' >&2
            exit 1
          fi
          echo 'RETIRED_TRADER_PRODUCTION_REFERENCES=0'

      - name: Reject retired AgentSettings aliases
        shell: bash
        run: |
          if git grep -n 'custom_system_instruction' -- \
            backend frontend \
            ':!backend/tests/test_services/test_legacy_settings_contract.py'; then
            echo 'retired custom_system_instruction alias still exists in production code' >&2
            exit 1
          fi
          echo 'CUSTOM_SYSTEM_INSTRUCTION_ALIAS=0'

      - name: Reject dead tenant context compatibility wrapper
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("backend/core/database.py")
          tree = ast.parse(path.read_text())
          names = {node.name for node in ast.walk(tree) if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}
          if "set_tenant_context" in names:
              raise SystemExit("dead set_tenant_context compatibility wrapper was reintroduced")
          print("SET_TENANT_CONTEXT_WRAPPER=0")
          PY

      - name: Reject deprecated refresh token response field
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          schema = ast.parse(Path("backend/schemas/auth.py").read_text())
          token_fields = set()
          refresh_request_fields = set()
          for node in schema.body:
              if isinstance(node, ast.ClassDef) and node.name in {"TokenResponse", "RefreshRequest"}:
                  fields = {
                      item.target.id
                      for item in node.body
                      if isinstance(item, ast.AnnAssign) and isinstance(item.target, ast.Name)
                  }
                  if node.name == "TokenResponse":
                      token_fields = fields
                  else:
                      refresh_request_fields = fields
          if "refresh_token" in token_fields:
              raise SystemExit("deprecated TokenResponse.refresh_token field was reintroduced")
          if "refresh_token" not in refresh_request_fields:
              raise SystemExit("CLI/API RefreshRequest.refresh_token compatibility was removed unintentionally")

          generated = Path("frontend/src/api/generated/model/tokenResponse.ts").read_text()
          if "refresh_token" in generated:
              raise SystemExit("generated TokenResponse still exposes refresh_token")
          print("REFRESH_TOKEN_RESPONSE_FIELD=0")
          PY

      - name: Reject direct refresh-session SQL in auth router
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path("backend/api/auth.py").read_text()
          forbidden = (
              "RefreshSession",
              "from sqlalchemy import delete",
              "from sqlalchemy import select",
              "set_refresh_access_context",
              ".with_for_update()",
          )
          hits = [token for token in forbidden if token in route]
          if hits:
              raise SystemExit(f"auth router regained refresh-session persistence orchestration: {hits}")
          print("AUTH_ROUTER_REFRESH_SESSION_SQL=0")
          PY

      - name: Reject legacy localStorage authentication
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          auth = Path("frontend/src/contexts/AuthContext.tsx").read_text()
          forbidden = (
              "const legacy = localStorage.getItem(TOKEN_KEY)",
              "sessionStorage.setItem(TOKEN_KEY, legacy)",
              "LEGACY_REFRESH_KEY",
              "One-time migration from older releases",
          )
          hits = [token for token in forbidden if token in auth]
          if hits:
              raise SystemExit(f"legacy localStorage authentication path remains: {hits}")
          if "return sessionStorage.getItem(TOKEN_KEY)" not in auth:
              raise SystemExit("getAccessToken is not sessionStorage-only")
          if "localStorage.removeItem('ta_refresh')" not in auth:
              raise SystemExit("stale localStorage refresh credentials are not purged")
          print("LOCALSTORAGE_AUTH_COMPATIBILITY=0")
          PY

      - name: Reject stale decision/checkpoint guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          doc = Path("CLAUDE.md").read_text()
          stale = (
              "Portfolio Manager (sole final structured investment decision)",
              "Portfolio Manager is the only agent with final decision authority",
              "falls back to per-analysis SQLite files",
          )
          hits = [text for text in stale if text in doc]
          if hits:
              raise SystemExit(f"CLAUDE.md contains stale architecture claims: {hits}")
          required = (
              "Strategy Context Loader",
              "Decision Stability Controller",
              "Portfolio Manager is the sole AI proposal authority",
              "LangGraph checkpoints require PostgreSQL",
          )
          missing = [text for text in required if text not in doc]
          if missing:
              raise SystemExit(f"CLAUDE.md is missing current architecture guidance: {missing}")
          print("STALE_CLAUDE_ARCHITECTURE=0")
          PY

      - name: Reject direct analysis SQL in trading router
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path("backend/api/trading.py").read_text()
          forbidden = ("AnalysisResult", "select(AnalysisResult", "from sqlalchemy import select")
          hits = [token for token in forbidden if token in route]
          if hits:
              raise SystemExit(f"trading router regained direct analysis SQL: {hits}")
          print("TRADING_ROUTER_ANALYSIS_SQL=0")
          PY

      - name: Reject alert mutation business logic in router
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path("backend/api/alerts.py").read_text()
          forbidden = (
              "target = float(",
              "setattr(alert",
              "await db.delete(",
              "alert.alert_type ==",
          )
          hits = [token for token in forbidden if token in route]
          if hits:
              raise SystemExit(f"alerts router regained mutation business logic: {hits}")
          if "update_user_alert" not in route or "delete_user_alert" not in route:
              raise SystemExit("alerts router is not delegating mutations to the service layer")
          print("ALERT_ROUTER_MUTATION_LOGIC=0")
          PY

      - name: Reject webhook validation compatibility facade
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          service_path = Path("backend/services/notification_service.py")
          tree = ast.parse(service_path.read_text())
          functions = {node.name for node in ast.walk(tree) if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}
          if "validate_webhook_url" in functions:
              raise SystemExit("notification_service.validate_webhook_url compatibility facade was reintroduced")
          if "resolve_webhook_target" not in functions:
              raise SystemExit("canonical resolve_webhook_target API is missing")

          for path in (Path("backend/api/settings.py"), Path("backend/services/settings_service.py")):
              text = path.read_text()
              if "notification_service import validate_webhook_url" in text:
                  raise SystemExit(f"legacy webhook validation import remains in {path}")
              if "resolve_webhook_target" not in text:
                  raise SystemExit(f"canonical webhook resolver is not used in {path}")
          print("WEBHOOK_VALIDATION_FACADE=0")
          PY

      - name: Run cleanup regression tests
        run: |
          uv run --project backend pytest \
            backend/tests/test_ai_engine/test_single_execution_authority.py \
            backend/tests/test_api/test_auth.py \
            backend/tests/test_api/test_portfolio.py \
            backend/tests/test_api/test_trading.py \
            backend/tests/test_api/test_share.py \
            backend/tests/test_temporal_safety.py \
            backend/tests/test_repositories/test_tenant_scoping_sweep.py \
            backend/tests/test_repositories/test_users.py \
            backend/tests/test_services/test_security_service.py \
            backend/tests/test_services/test_config_builder_secrets.py \
            backend/tests/test_services/test_legacy_settings_contract.py \
            backend/tests/test_services/test_alert_management_service.py

      - name: Run backend lint
        run: |
          uv run --project backend ruff check \
            backend/trading_agents/__init__.py \
            backend/trading_agents/agents/runtime/logging_config.py \
            backend/trading_agents/agents/main/risk.py \
            backend/trading_agents/agents/data/review_tools.py \
            backend/services/analysis/portfolio_orchestrator.py \
            backend/services/analysis/orchestrator.py \
            backend/services/analysis/config_builder.py \
            backend/services/notification_service.py \
            backend/services/settings_service.py \
            backend/api/trading.py \
            backend/api/auth.py \
            backend/api/alerts.py \
            backend/api/share.py \
            backend/api/settings.py \
            backend/services/mock_trading_service.py \
            backend/services/auth_session_service.py \
            backend/services/alert_management_service.py \
            backend/repositories/refresh_sessions.py \
            backend/repositories/alerts.py \
            backend/core/database.py \
            backend/core/catalog.py \
            backend/models/analysis.py \
            backend/schemas/analysis.py \
            backend/schemas/share.py \
            backend/schemas/auth.py \
            backend/schemas/settings.py \
            backend/tests/test_ai_engine/test_single_execution_authority.py \
            backend/tests/conftest.py \
            backend/tests/helpers/factories.py \
            backend/tests/test_api/test_auth.py \
            backend/tests/test_api/test_portfolio.py \
            backend/tests/test_api/test_trading.py \
            backend/tests/test_api/test_share.py \
            backend/tests/test_temporal_safety.py \
            backend/tests/test_repositories/test_tenant_scoping_sweep.py \
            backend/tests/test_repositories/test_users.py \
            backend/tests/test_services/test_security_service.py \
            backend/tests/test_services/test_config_builder_secrets.py \
            backend/tests/test_services/test_legacy_settings_contract.py \
            backend/tests/test_services/test_alert_management_service.py \
            backend/postgres_tests/test_rls_integration.py \
            backend/api/users.py \
            backend/main.py \
            backend/worker.py \
            backend/core/password_hashing.py \
            backend/core/security.py \
            backend/alembic/versions/20260816_0021-bc23d4e5f6a7_encrypt_legacy_tool_secrets.py \
            backend/alembic/versions/20260816_0022-cd34e5f6a7b8_remove_noop_risk_rounds.py \
            backend/alembic/versions/20260816_0023-de45f6a7b8c9_remove_retired_trader_history.py

      - name: Verify Alembic has one head
        shell: bash
        run: |
          cd backend
          heads="$(uv run alembic heads | tee /dev/stderr | wc -l)"
          test "$heads" -eq 1

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend cleanup tests
        run: |
          npm --prefix frontend test -- \
            src/analysis/__tests__/streamingReports.test.ts \
            src/analysis/__tests__/portfolioDecision.test.ts \
            src/contexts/__tests__/AuthContext.test.tsx \
            src/pages/__tests__/SharedReport.test.tsx \
            src/utils/__tests__/exportReport.test.ts

      - name: Build frontend
        run: npm --prefix frontend run build
