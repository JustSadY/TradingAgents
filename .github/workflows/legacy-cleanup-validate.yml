name: Legacy cleanup validation

on:
  push:
    branches:
      - agent/legacy-cleanup-pass4
    paths:
      - .github/workflows/legacy-cleanup-validate.yml
      - backend/trading_agents/__init__.py
      - backend/trading_agents/agents/runtime/logging_config.py
      - backend/trading_agents/agents/main/risk.py
      - backend/services/analysis/portfolio_orchestrator.py
      - backend/trading_agents/agents/data/review_tools.py
      - backend/services/analysis/config_builder.py
      - backend/alembic/versions/**
      - backend/tests/**
      - backend/postgres_tests/**
      - frontend/src/App.tsx
      - frontend/src/i18n/analysis.ts
      - backend/api/auth.py
      - backend/api/users.py
      - backend/main.py
      - backend/worker.py
      - backend/core/password_hashing.py
      - backend/core/security.py

permissions:
  contents: read

jobs:
  validate-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reject legacy password facade imports
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          password_names = {
              "hash_password",
              "is_supported_password_hash",
              "verify_and_update_password",
              "verify_password",
          }
          hits = []
          for path in sorted(Path("backend").rglob("*.py")):
              if path.as_posix() == "backend/core/security.py":
                  continue
              try:
                  tree = ast.parse(path.read_text())
              except (SyntaxError, UnicodeDecodeError):
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module == "backend.core.security":
                      names = sorted({alias.name for alias in node.names} & password_names)
                      if names:
                          hits.append((path.as_posix(), node.lineno, names))
          if hits:
              for path, line, names in hits:
                  print(f"LEGACY_PASSWORD_FACADE {path}:{line} {','.join(names)}")
              raise SystemExit(f"legacy password facade imports remain: {len(hits)}")
          print("LEGACY_PASSWORD_FACADE_IMPORTS=0")
          PY

      - name: Reject import-time engine logging side effects
        shell: bash
        run: |
          uv run --project backend python - <<'PY'
          import logging
          import sys
          from pathlib import Path

          root = logging.getLogger()
          handlers_before = tuple(root.handlers)
          excepthook_before = sys.excepthook
          import backend.trading_agents  # noqa: F401

          if tuple(root.handlers) != handlers_before:
              raise SystemExit("import backend.trading_agents changed root logging handlers")
          if sys.excepthook is not excepthook_before:
              raise SystemExit("import backend.trading_agents changed sys.excepthook")

          web = Path("backend/main.py").read_text()
          worker = Path("backend/worker.py").read_text()
          package_init = Path("backend/trading_agents/__init__.py").read_text()
          if "setup_unified_logging()" not in web:
              raise SystemExit("web lifespan does not explicitly initialize engine logging")
          if "setup_unified_logging()" not in worker:
              raise SystemExit("worker startup does not explicitly initialize engine logging")
          if "setup_unified_logging" in package_init:
              raise SystemExit("engine package import still initializes logging")
          print("IMPORT_TIME_ENGINE_LOGGING=0")
          PY

      - name: Reject obsolete preferences route alias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("frontend/src/App.tsx").read_text()
          if 'path="preferences"' in app or 'path="/preferences"' in app:
              raise SystemExit("obsolete /preferences route alias still exists")
          if 'path="settings"' not in app:
              raise SystemExit("canonical /settings route is missing")
          print("PREFERENCES_ROUTE_ALIAS=0")
          PY

      - name: Run cleanup regression tests
        run: |
          uv run --project backend pytest \
            backend/tests/test_ai_engine/test_single_execution_authority.py \
            backend/tests/test_api/test_auth.py \
            backend/tests/test_api/test_portfolio.py \
            backend/tests/test_repositories/test_tenant_scoping_sweep.py \
            backend/tests/test_repositories/test_users.py \
            backend/tests/test_services/test_security_service.py \
            backend/tests/test_services/test_config_builder_secrets.py

      - name: Run backend lint
        run: |
          uv run --project backend ruff check \
            backend/trading_agents/__init__.py \
            backend/trading_agents/agents/runtime/logging_config.py \
            backend/trading_agents/agents/main/risk.py \
            backend/services/analysis/portfolio_orchestrator.py \
            backend/trading_agents/agents/data/review_tools.py \
            backend/services/analysis/config_builder.py \
            backend/tests/test_ai_engine/test_single_execution_authority.py \
            backend/tests/conftest.py \
            backend/tests/helpers/factories.py \
            backend/tests/test_api/test_auth.py \
            backend/tests/test_api/test_portfolio.py \
            backend/tests/test_repositories/test_tenant_scoping_sweep.py \
            backend/tests/test_repositories/test_users.py \
            backend/tests/test_services/test_security_service.py \
            backend/tests/test_services/test_config_builder_secrets.py \
            backend/postgres_tests/test_rls_integration.py \
            backend/api/auth.py \
            backend/api/users.py \
            backend/main.py \
            backend/worker.py \
            backend/core/password_hashing.py \
            backend/core/security.py \
            backend/alembic/versions/20260816_0021-bc23d4e5f6a7_encrypt_legacy_tool_secrets.py

      - name: Verify Alembic has one head
        shell: bash
        run: |
          cd backend
          heads="$(uv run alembic heads | tee /dev/stderr | wc -l)"
          test "$heads" -eq 1

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build
