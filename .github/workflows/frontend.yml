name: Frontend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  # The typed client under src/api/generated is generated from the backend's
  # OpenAPI document. If an endpoint changes and the client is not regenerated,
  # the frontend keeps compiling against an API that no longer exists.
  api-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate OpenAPI document
        working-directory: backend
        run: uv run --frozen python scripts/export-openapi.py ../frontend/openapi.json

      - name: Regenerate typed client
        run: npm run generate:client

      - name: Generated client is up to date
        working-directory: .
        run: |
          git diff --exit-code -- frontend/openapi.json frontend/src/api/generated \
            || { echo "::error::API client is stale — run 'npm run generate:api' in frontend/ and commit the result"; exit 1; }

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # `npm run build` runs `tsc -b` first, so this also gates type errors.
      - name: Build
        run: npm run build
