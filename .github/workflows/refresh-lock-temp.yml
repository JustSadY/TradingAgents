name: Refresh backend lock (temporary)

on:
  push:
    branches:
      - fix/strategy-intent-followup

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strategy-intent-followup
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Resolve backend dependencies
        run: uv lock --project backend

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- backend/uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git commit -m "Refresh backend dependency lock"
          git push origin HEAD:fix/strategy-intent-followup
