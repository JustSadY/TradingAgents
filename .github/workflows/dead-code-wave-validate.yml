name: Dead code wave validation

on:
  push:
    branches:
      - agent/legacy-cleanup-pass4
    paths:
      - .github/workflows/dead-code-wave-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Reject removed dead symbols
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          if Path('backend/trading_agents/agents/runtime/risk_math.py').exists():
              raise SystemExit('retired Trader risk_math.py still exists')

          expected_absent = {
              'backend/core/exceptions.py': {'NotFoundError'},
              'backend/core/money.py': {'format_money', 'to_float_safe'},
              'backend/trading_agents/agents/base.py': {'MainAgentNode', 'SubAgentRunner'},
              'backend/trading_agents/agents/runtime/analyst_execution.py': {
                  'get_initial_analyst_node', 'sync_analyst_tracker_from_chunk'
              },
              'backend/services/margin_engine.py': {'position_equity_long', 'position_equity_short'},
              'backend/services/analysis/persistence.py': {'finalize_result'},
              'backend/core/redis_bus.py': {'set_redis_for_testing'},
              'backend/services/indicator_service.py': {'calculate_ichimoku', 'calculate_fibonacci_levels'},
          }
          for filename, forbidden in expected_absent.items():
              tree = ast.parse(Path(filename).read_text())
              defined = {
                  node.name
                  for node in ast.walk(tree)
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
              }
              hits = sorted(defined & forbidden)
              if hits:
                  raise SystemExit(f'{filename}: removed dead symbols returned: {hits}')
          print('DEAD_CODE_SYMBOLS=0')
          PY

      - name: Run focused regressions
        run: |
          uv run --project backend pytest \
            backend/tests/test_services/test_indicator_parity.py \
            backend/tests/test_services/test_second_wave_regressions.py \
            backend/tests/test_services/test_trading_orchestrator_execution.py

      - name: Run Ruff
        run: |
          uv run --project backend ruff check \
            backend/core/exceptions.py \
            backend/core/money.py \
            backend/core/redis_bus.py \
            backend/services/margin_engine.py \
            backend/services/analysis/persistence.py \
            backend/services/indicator_service.py \
            backend/trading_agents/agents/base.py \
            backend/trading_agents/agents/runtime/analyst_execution.py

      - name: Import changed modules
        run: |
          uv run --project backend python - <<'PY'
          import backend.core.exceptions
          import backend.core.money
          import backend.core.redis_bus
          import backend.services.margin_engine
          import backend.services.analysis.persistence
          import backend.services.indicator_service
          import backend.trading_agents.agents.base
          import backend.trading_agents.agents.runtime.analyst_execution
          print('IMPORTS_OK')
          PY
