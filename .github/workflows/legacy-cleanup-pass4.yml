name: Legacy cleanup pass 4

on:
  push:
    branches:
      - agent/legacy-cleanup-pass4
    paths:
      - .github/workflows/legacy-cleanup-pass4.yml
      - backend/services/decision_stability_service.py
      - backend/tests/test_services/test_decision_stability_service.py

permissions:
  contents: write

jobs:
  remove-decision-stability-wrapper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-cleanup-pass4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Remove unused wrapper and wrapper-only test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('backend/services/decision_stability_service.py')
          service = service_path.read_text()
          start_marker = '\nclass DecisionStabilityController:'
          end_marker = '\ndef _coerce_thresholds'
          start = service.index(start_marker)
          end = service.index(end_marker, start)
          service = service[:start] + '\n\n' + service[end:]
          service = service.replace('    "DecisionStabilityController",\n', '')
          service_path.write_text(service)

          test_path = Path('backend/tests/test_services/test_decision_stability_service.py')
          tests = test_path.read_text()
          tests = tests.replace('    DecisionStabilityController,\n', '')
          tests = tests.replace('    StabilityThresholds,\n', '')
          wrapper_test = '\ndef test_controller_wrapper_uses_custom_thresholds() -> None:'
          wrapper_start = tests.index(wrapper_test)
          tests = tests[:wrapper_start].rstrip() + '\n'
          test_path.write_text(tests)
          PY

      - name: Verify wrapper is gone
        run: |
          if git grep -n 'DecisionStabilityController' -- backend ':!backend/poc' ; then
            echo 'DecisionStabilityController reference remains' >&2
            exit 1
          fi

      - name: Run targeted tests
        run: uv run --project backend pytest backend/tests/test_services/test_decision_stability_service.py

      - name: Run targeted lint
        run: uv run --project backend ruff check backend/services/decision_stability_service.py backend/tests/test_services/test_decision_stability_service.py

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/services/decision_stability_service.py backend/tests/test_services/test_decision_stability_service.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'Remove unused decision stability wrapper'
          git push origin HEAD:agent/legacy-cleanup-pass4
