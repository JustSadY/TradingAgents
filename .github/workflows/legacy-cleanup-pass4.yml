name: Legacy cleanup pass 4

on:
  push:
    branches:
      - agent/legacy-cleanup-pass4
    paths:
      - .github/workflows/legacy-cleanup-pass4.yml

permissions:
  contents: write

jobs:
  remove-noop-risk-round-setting:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-cleanup-pass4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Remove max_risk_rounds end to end
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str = "", count: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              target.write_text(text.replace(old, new))

          replace_exact(
              'backend/models/settings.py',
              '    max_risk_rounds: Mapped[int] = mapped_column(Integer, default=1)\n',
          )
          replace_exact(
              'backend/models/page_permission.py',
              '        "max_risk_rounds",\n',
          )
          replace_exact(
              'backend/schemas/settings.py',
              '    max_risk_rounds: int = 1\n',
          )
          replace_exact(
              'backend/schemas/settings.py',
              '    max_risk_rounds: int | None = Field(default=None, ge=1, le=10)\n',
          )
          replace_exact(
              'backend/services/analysis/config_builder.py',
              '        "max_risk_discuss_rounds": settings.max_risk_rounds,\n',
          )
          replace_exact(
              'backend/trading_agents/config.py',
              '    max_risk_discuss_rounds: int = Field(default=1, ge=1, le=10)\n',
          )
          replace_exact(
              'backend/trading_agents/graph/conditional_logic.py',
              '\n    def __init__(self, max_debate_rounds=1, max_risk_discuss_rounds=1):\n'
              '        self.max_debate_rounds = max_debate_rounds\n'
              '        self.max_risk_discuss_rounds = max_risk_discuss_rounds\n',
              '\n',
          )
          replace_exact(
              'backend/trading_agents/graph/trading_graph.py',
              '        self.conditional_logic = ConditionalLogic(\n'
              '            max_debate_rounds=self.config["max_debate_rounds"],\n'
              '            max_risk_discuss_rounds=self.config["max_risk_discuss_rounds"],\n'
              '        )\n',
              '        self.conditional_logic = ConditionalLogic()\n',
          )

          risk_tab = Path('frontend/src/components/settings/tabs/RiskTab.tsx')
          text = risk_tab.read_text()
          start_marker = "              <RiskRowItem label={t('settings.row_risk_rounds')} unit=\"tur\">\n"
          start = text.index(start_marker)
          end = text.index('              </RiskRowItem>\n', start) + len('              </RiskRowItem>\n')
          risk_tab.write_text(text[:start] + text[end:])

          i18n = Path('frontend/src/i18n/settings.ts')
          lines = i18n.read_text().splitlines(keepends=True)
          removed = [line for line in lines if "'settings.row_risk_rounds':" in line]
          if not removed:
              raise SystemExit('frontend/src/i18n/settings.ts: no row_risk_rounds translations found')
          i18n.write_text(''.join(line for line in lines if "'settings.row_risk_rounds':" not in line))

          migration = Path('backend/alembic/versions/20260816_0021-ac12d3e4f5a6_remove_noop_risk_rounds.py')
          if migration.exists():
              raise SystemExit(f'{migration} already exists')
          migration.write_text('''"""remove the retired no-op risk round setting\n\nRevision ID: ac12d3e4f5a6\nRevises: 9b01c2d3e4f5\nCreate Date: 2026-08-16 13:00:00.000000+00:00\n\nThe former max_risk_rounds setting was persisted and exposed to users but the\ncurrent Risk Debate node performs one merged LLM call and never consumes it.\nDrop the misleading contract and its unused database column.\n"""\n\nfrom collections.abc import Sequence\n\nfrom alembic import op\nimport sqlalchemy as sa\n\nrevision: str = "ac12d3e4f5a6"\ndown_revision: str | None = "9b01c2d3e4f5"\nbranch_labels: str | Sequence[str] | None = None\ndepends_on: str | Sequence[str] | None = None\n\n\ndef upgrade() -> None:\n    op.drop_column("app_settings", "max_risk_rounds")\n\n\ndef downgrade() -> None:\n    op.add_column(\n        "app_settings",\n        sa.Column("max_risk_rounds", sa.Integer(), server_default=sa.text("1"), nullable=False),\n    )\n''')
          PY

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Regenerate OpenAPI client
        run: npm --prefix frontend run generate:api

      - name: Verify retired setting is absent from live code and generated API
        shell: bash
        run: |
          if git grep -n -E 'max_risk_rounds|max_risk_discuss_rounds|row_risk_rounds' -- \
            ':!backend/alembic/versions/*' \
            ':!.github/workflows/legacy-cleanup-pass4.yml'; then
            echo 'Retired risk-round setting still appears in live code' >&2
            exit 1
          fi

      - name: Run backend settings and debate tests
        run: |
          uv run --project backend pytest \
            backend/tests/test_api/test_settings.py \
            backend/tests/test_ai_engine/test_research_manager_fallback.py \
            backend/tests/test_ai_engine/test_live_consensus_debate.py \
            backend/tests/test_services/test_analysis_liveness_and_resilience.py

      - name: Run backend lint
        run: |
          uv run --project backend ruff check \
            backend/models/settings.py \
            backend/models/page_permission.py \
            backend/schemas/settings.py \
            backend/services/analysis/config_builder.py \
            backend/trading_agents/config.py \
            backend/trading_agents/graph/conditional_logic.py \
            backend/trading_agents/graph/trading_graph.py \
            backend/alembic/versions/20260816_0021-ac12d3e4f5a6_remove_noop_risk_rounds.py

      - name: Verify Alembic has one head
        shell: bash
        run: |
          cd backend
          heads="$(uv run alembic heads | tee /dev/stderr | wc -l)"
          test "$heads" -eq 1

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/models/settings.py \
            backend/models/page_permission.py \
            backend/schemas/settings.py \
            backend/services/analysis/config_builder.py \
            backend/trading_agents/config.py \
            backend/trading_agents/graph/conditional_logic.py \
            backend/trading_agents/graph/trading_graph.py \
            backend/alembic/versions/20260816_0021-ac12d3e4f5a6_remove_noop_risk_rounds.py \
            frontend/src/components/settings/tabs/RiskTab.tsx \
            frontend/src/i18n/settings.ts \
            frontend/openapi.json \
            frontend/src/api/generated
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'Remove no-op risk round setting'
          git push origin HEAD:agent/legacy-cleanup-pass4
