name: Remove LEG-019 no-op risk rounds

on:
  push:
    branches:
      - agent/legacy-cleanup-pass4
    paths:
      - .github/workflows/leg019-remove-noop-risk-rounds.yml

permissions:
  contents: write

jobs:
  remove-noop-risk-rounds:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-cleanup-pass4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Remove the no-op setting end to end
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str = "", count: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              target.write_text(text.replace(old, new))

          replace_exact(
              "backend/models/settings.py",
              "    max_risk_rounds: Mapped[int] = mapped_column(Integer, default=1)\n",
          )
          replace_exact(
              "backend/models/page_permission.py",
              '        "max_risk_rounds",\n',
          )
          replace_exact(
              "backend/schemas/settings.py",
              "    max_risk_rounds: int = 1\n",
          )
          replace_exact(
              "backend/schemas/settings.py",
              "    max_risk_rounds: int | None = Field(default=None, ge=1, le=10)\n",
          )
          replace_exact(
              "backend/services/analysis/config_builder.py",
              '        "max_risk_discuss_rounds": settings.max_risk_rounds,\n',
          )
          replace_exact(
              "backend/trading_agents/config.py",
              "    max_risk_discuss_rounds: int = Field(default=1, ge=1, le=10)\n",
          )
          replace_exact(
              "backend/trading_agents/graph/conditional_logic.py",
              "\n    def __init__(self, max_debate_rounds=1, max_risk_discuss_rounds=1):\n"
              "        self.max_debate_rounds = max_debate_rounds\n"
              "        self.max_risk_discuss_rounds = max_risk_discuss_rounds",
              "",
          )
          replace_exact(
              "backend/trading_agents/graph/trading_graph.py",
              '        self.conditional_logic = ConditionalLogic(\n'
              '            max_debate_rounds=self.config["max_debate_rounds"],\n'
              '            max_risk_discuss_rounds=self.config["max_risk_discuss_rounds"],\n'
              '        )\n',
              "        self.conditional_logic = ConditionalLogic()\n",
          )

          risk_tab = Path("frontend/src/components/settings/tabs/RiskTab.tsx")
          text = risk_tab.read_text()
          block = '''              <RiskRowItem label={t('settings.row_risk_rounds')} unit="tur">\n                <input\n                  type="number"\n                  min="1"\n                  max="10"\n                  className={CompactInputStyle}\n                  value={s.max_risk_rounds}\n                  onChange={e => update('max_risk_rounds', Number.parseInt(e.target.value))}\n                />\n              </RiskRowItem>\n\n'''
          if text.count(block) != 1:
              raise SystemExit("RiskTab: expected exactly one max_risk_rounds control")
          risk_tab.write_text(text.replace(block, ""))

          i18n = Path("frontend/src/i18n/settings.ts")
          lines = i18n.read_text().splitlines(keepends=True)
          matches = [line for line in lines if "'settings.row_risk_rounds':" in line]
          if len(matches) != 2:
              raise SystemExit(f"settings.ts: expected 2 risk-round translation lines, found {len(matches)}")
          i18n.write_text("".join(line for line in lines if "'settings.row_risk_rounds':" not in line))

          migration = Path("backend/alembic/versions/20260816_0022-cd34e5f6a7b8_remove_noop_risk_rounds.py")
          if migration.exists():
              raise SystemExit(f"{migration} already exists")
          migration.write_text('''"""remove the retired no-op risk round setting

Revision ID: cd34e5f6a7b8
Revises: bc23d4e5f6a7
Create Date: 2026-08-16 13:55:00.000000+00:00

The current Risk Debate node performs one merged LLM call and never consumes
max_risk_rounds. The setting was persisted and editable despite having no
runtime effect, so remove the misleading contract and its database column.
"""

from collections.abc import Sequence

import sqlalchemy as sa

from alembic import op

revision: str = "cd34e5f6a7b8"
down_revision: str | None = "bc23d4e5f6a7"
branch_labels: str | Sequence[str] | None = None
depends_on: str | Sequence[str] | None = None


def upgrade() -> None:
    op.drop_column("app_settings", "max_risk_rounds")


def downgrade() -> None:
    op.add_column(
        "app_settings",
        sa.Column("max_risk_rounds", sa.Integer(), server_default=sa.text("1"), nullable=False),
    )
''')
          PY

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Regenerate frontend OpenAPI client
        run: npm --prefix frontend run generate:api

      - name: Verify no live LEG-019 references remain
        shell: bash
        run: |
          if git grep -n -E 'max_risk_rounds|max_risk_discuss_rounds|row_risk_rounds' -- \
            ':!backend/alembic/versions/*' \
            ':!.github/workflows/leg019-remove-noop-risk-rounds.yml'; then
            echo 'LEG-019 reference remains in live code or generated artifacts' >&2
            exit 1
          fi

      - name: Verify runtime contracts no longer expose the setting
        shell: bash
        run: |
          uv run --project backend python - <<'PY'
          from backend.schemas.settings import SettingsRead, SettingsUpdate
          from backend.trading_agents.config import TradingAgentsConfig
          from backend.trading_agents.graph.conditional_logic import ConditionalLogic

          assert "max_risk_rounds" not in SettingsRead.model_fields
          assert "max_risk_rounds" not in SettingsUpdate.model_fields
          assert "max_risk_discuss_rounds" not in TradingAgentsConfig.model_fields
          logic = ConditionalLogic()
          assert not hasattr(logic, "max_risk_discuss_rounds")
          assert not hasattr(logic, "max_debate_rounds")
          print("LEG019_RUNTIME_CONTRACT=clean")
          PY

      - name: Run targeted backend tests
        run: |
          uv run --project backend pytest \
            backend/tests/test_api/test_settings.py \
            backend/tests/test_ai_engine/test_research_manager_fallback.py \
            backend/tests/test_ai_engine/test_live_consensus_debate.py \
            backend/tests/test_ai_engine/test_fallback_runtime_contract.py \
            backend/tests/test_services/test_analysis_liveness_and_resilience.py

      - name: Run backend lint
        run: |
          uv run --project backend ruff check \
            backend/models/settings.py \
            backend/models/page_permission.py \
            backend/schemas/settings.py \
            backend/services/analysis/config_builder.py \
            backend/trading_agents/config.py \
            backend/trading_agents/graph/conditional_logic.py \
            backend/trading_agents/graph/trading_graph.py \
            backend/alembic/versions/20260816_0022-cd34e5f6a7b8_remove_noop_risk_rounds.py

      - name: Verify Alembic has exactly one head
        shell: bash
        run: |
          cd backend
          heads="$(uv run alembic heads | tee /dev/stderr | wc -l)"
          test "$heads" -eq 1

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/models/settings.py \
            backend/models/page_permission.py \
            backend/schemas/settings.py \
            backend/services/analysis/config_builder.py \
            backend/trading_agents/config.py \
            backend/trading_agents/graph/conditional_logic.py \
            backend/trading_agents/graph/trading_graph.py \
            backend/alembic/versions/20260816_0022-cd34e5f6a7b8_remove_noop_risk_rounds.py \
            frontend/src/components/settings/tabs/RiskTab.tsx \
            frontend/src/i18n/settings.ts \
            frontend/openapi.json \
            frontend/src/api/generated
          git diff --cached --check
          git commit -m 'Remove no-op risk round setting'
          git push origin HEAD:agent/legacy-cleanup-pass4
