name: LEG019 cleanup

on:
  push:
    branches: [agent/legacy-cleanup-pass4]
    paths:
      - .github/workflows/leg019-remove-noop-risk-rounds.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-cleanup-pass4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply cleanup
        run: python .github/scripts/leg019_cleanup.py
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Regenerate frontend API client
        run: npm --prefix frontend run generate:api
      - name: Reject remaining live references
        shell: bash
        run: |
          if git grep -n -E 'max_risk_rounds|max_risk_discuss_rounds|row_risk_rounds' -- ':!backend/alembic/versions/*' ':!.github/workflows/leg019-remove-noop-risk-rounds.yml' ':!.github/scripts/leg019_cleanup.py'; then
            exit 1
          fi
      - name: Verify runtime contract
        run: |
          uv run --project backend python -c "from backend.schemas.settings import SettingsRead,SettingsUpdate; from backend.trading_agents.config import TradingAgentsConfig; from backend.trading_agents.graph.conditional_logic import ConditionalLogic; assert 'max_risk_rounds' not in SettingsRead.model_fields; assert 'max_risk_rounds' not in SettingsUpdate.model_fields; assert 'max_risk_discuss_rounds' not in TradingAgentsConfig.model_fields; x=ConditionalLogic(); assert not hasattr(x,'max_risk_discuss_rounds')"
      - name: Run targeted backend tests
        run: |
          uv run --project backend pytest backend/tests/test_api/test_settings.py backend/tests/test_ai_engine/test_research_manager_fallback.py backend/tests/test_ai_engine/test_live_consensus_debate.py backend/tests/test_ai_engine/test_fallback_runtime_contract.py backend/tests/test_services/test_analysis_liveness_and_resilience.py
      - name: Run backend lint
        run: |
          uv run --project backend ruff check backend/models/settings.py backend/models/page_permission.py backend/schemas/settings.py backend/services/analysis/config_builder.py backend/trading_agents/config.py backend/trading_agents/graph/conditional_logic.py backend/trading_agents/graph/trading_graph.py backend/alembic/versions/20260816_0022-cd34e5f6a7b8_remove_noop_risk_rounds.py
      - name: Verify Alembic head
        shell: bash
        run: |
          cd backend
          test "$(uv run alembic heads | wc -l)" -eq 1
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend frontend
          git diff --cached --check
          git commit -m 'Remove no-op risk round setting'
          git push origin HEAD:agent/legacy-cleanup-pass4
