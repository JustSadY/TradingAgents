name: Validate pgvector provisioning once

on:
  push:
    branches:
      - agent/memory-strategy-stability
    paths:
      - .github/workflows/final-pgvector-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/memory-strategy-stability
      - name: Apply final pgvector patches
        run: python .github/final_pgvector_fix.py
      - name: Install locked backend
        run: |
          python -m pip install --upgrade uv
          cd backend
          uv lock --check
          uv sync --frozen
          uv run ruff check core/config.py core/database.py core/rls.py alembic/env.py alembic/versions/20260814_0018-7f8091a2b3c4_pgvector_and_tenant_rls.py
          uv run python -m compileall -q .
      - name: Validate deployment files
        run: |
          bash -n deploy/install.sh
          bash -n deploy/update.sh
          bash -n deploy/provision-postgres-roles.sh
          sh -n deploy/docker-db-prepare.sh
          DB_PASSWORD=migration-test \
          DB_RUNTIME_PASSWORD=runtime-test \
          SECRET_KEY=secret-test \
          ADMIN_PASSWORD_HASH=hash-test \
          ENCRYPTION_KEY=key-test \
          CORS_ORIGINS='["http://localhost:5173"]' \
          METRICS_TOKEN=metrics-test \
          GRAFANA_ADMIN_PASSWORD=grafana-test \
          docker compose config >/dev/null
          grep -q 'pgvector/pgvector:0.8.6-pg16' docker-compose.yml
      - name: Prove non-superuser migration and runtime RLS role
        env:
          PGPASSWORD: postgres
        run: |
          command -v psql >/dev/null || { sudo apt-get update -y && sudo apt-get install -y postgresql-client; }
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ta_migrator LOGIN PASSWORD 'migrator' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE ta_runtime LOGIN PASSWORD 'runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE tradingagents OWNER ta_migrator;
          SQL
          psql -h 127.0.0.1 -U postgres -d tradingagents -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector;'
          PGPASSWORD=migrator psql -h 127.0.0.1 -U ta_migrator -d tradingagents -v ON_ERROR_STOP=1 <<'SQL'
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ta_runtime;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ta_runtime;
          SQL
          MIGRATION_DATABASE_URL='postgresql+asyncpg://ta_migrator:migrator@127.0.0.1:5432/tradingagents' \
            backend/.venv/bin/alembic -c backend/alembic.ini upgrade head
          PGPASSWORD=migrator psql -h 127.0.0.1 -U ta_migrator -d tradingagents -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO ta_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ta_runtime;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO ta_runtime;
          SQL
          HASH="$(backend/.venv/bin/python -c 'import bcrypt; print(bcrypt.hashpw(b"validation-password", bcrypt.gensalt()).decode())')"
          FERNET="$(backend/.venv/bin/python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          ENVIRONMENT=production \
          DATABASE_URL='postgresql+asyncpg://ta_runtime:runtime@127.0.0.1:5432/tradingagents' \
          SECRET_KEY='validation-secret-key-that-is-not-default' \
          ENCRYPTION_KEY="$FERNET" \
          ADMIN_PASSWORD_HASH="$HASH" \
          PYTHONPATH=. \
          backend/.venv/bin/python - <<'PY'
          import asyncio
          from backend.core.database import engine, _verify_schema_at_alembic_head
          from backend.core.rls import verify_runtime_rls_role

          async def main():
              await _verify_schema_at_alembic_head()
              assert await verify_runtime_rls_role(engine) is True
              await engine.dispose()

          asyncio.run(main())
          PY
      - name: Run focused regression tests
        run: |
          cd backend
          uv run pytest tests/test_services/test_retry_authority.py tests/test_services/test_rls_role_validation.py tests/test_core/test_llm_catalog.py
      - name: Commit and remove temporary validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/final_pgvector_fix.py .github/workflows/final-pgvector-once.yml
          git add -A
          git commit -m "Finish pgvector provisioning and migration isolation"
          git push origin HEAD:agent/memory-strategy-stability
