name: Finish architecture once

on:
  push:
    branches:
      - agent/memory-strategy-stability
    paths:
      - .github/workflows/uv-lock-once.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/memory-strategy-stability
      - name: Apply final architecture patches
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          # Production must use PostgreSQL; SQLite remains development/test-only.
          replace(
              "backend/core/config.py",
              '        if self.ENVIRONMENT.strip().lower() == "production":\n            problems = []\n',
              '        if self.ENVIRONMENT.strip().lower() == "production":\n            problems = []\n'
              '            if not self.DATABASE_URL.lower().startswith("postgresql+asyncpg://"):\n'
              '                problems.append("DATABASE_URL must use PostgreSQL/asyncpg in production")\n',
          )

          # Production RLS is always fail-closed; the env switch can opt dev/staging into the same check.
          replace(
              "backend/core/rls.py",
              'def _strict_enabled() -> bool:\n    return os.getenv("RLS_STRICT_MODE", "").strip().lower() in {"1", "true", "yes", "on"}\n',
              'def _strict_enabled() -> bool:\n'
              '    explicit = os.getenv("RLS_STRICT_MODE", "").strip().lower() in {"1", "true", "yes", "on"}\n'
              '    production = os.getenv("ENVIRONMENT", "").strip().lower() == "production"\n'
              '    return explicit or production\n',
          )

          # Alembic CLI can receive a privileged migration URL without putting it in app Settings/.env.
          replace("backend/alembic/env.py", "import asyncio\nimport logging\n", "import asyncio\nimport logging\nimport os\n")
          replace(
              "backend/alembic/env.py",
              '# Single source of truth for the URL: the app settings, not a duplicate in alembic.ini.\n'
              '# ``%`` is doubled because configparser would otherwise treat a percent-encoded\n'
              '# password as interpolation syntax and raise on set_main_option().\n'
              'config.set_main_option("sqlalchemy.url", get_settings().DATABASE_URL.replace("%", "%%"))\n',
              '# Standalone migrations may use a privileged URL supplied only to the migration\n'
              '# process. The web/worker processes never need that credential. Without the\n'
              '# override (development/tests), Alembic uses the normal application URL.\n'
              'migration_url = os.getenv("MIGRATION_DATABASE_URL", "").strip() or get_settings().DATABASE_URL\n'
              'if migration_url.startswith("postgresql://"):\n'
              '    migration_url = "postgresql+asyncpg://" + migration_url.removeprefix("postgresql://")\n'
              'elif migration_url.startswith("postgres://"):\n'
              '    migration_url = "postgresql+asyncpg://" + migration_url.removeprefix("postgres://")\n'
              '# ``%`` is doubled because configparser treats percent-encoded passwords as interpolation.\n'
              'config.set_main_option("sqlalchemy.url", migration_url.replace("%", "%%"))\n',
          )

          # In production, migrations are an explicit deploy step. Runtime only verifies schema + RLS.
          database_helpers = '''\n\ndef _expected_alembic_heads() -> set[str]:\n    from alembic.script import ScriptDirectory\n\n    return set(ScriptDirectory.from_config(_alembic_config()).get_heads())\n\n\nasync def _verify_schema_at_alembic_head() -> None:\n    async with engine.connect() as conn:\n        if not await _has_alembic_version(conn):\n            raise RuntimeError(\n                "Production database is not Alembic-managed. Run `alembic -c backend/alembic.ini upgrade head` "\n                "with the migration role before starting the application."\n            )\n        rows = await conn.execute(text("SELECT version_num FROM alembic_version"))\n        current = set(rows.scalars())\n\n    expected = _expected_alembic_heads()\n    if current != expected:\n        raise RuntimeError(\n            "Production database schema is not at Alembic head: "\n            f"current={sorted(current)}, expected={sorted(expected)}. "\n            "Run the migration step before starting web/worker processes."\n        )\n\n'''
          replace("backend/core/database.py", "\nasync def create_all_tables():\n", database_helpers + "\nasync def create_all_tables():\n")
          replace(
              "backend/core/database.py",
              '        return\n\n    async with engine.begin() as conn:\n',
              '        return\n\n'
              '    if settings.ENVIRONMENT.strip().lower() == "production":\n'
              '        await _verify_schema_at_alembic_head()\n'
              '        from backend.core.rls import verify_runtime_rls_role\n\n'
              '        await verify_runtime_rls_role(engine)\n'
              '        return\n\n'
              '    async with engine.begin() as conn:\n',
          )

          # Locked dependency installation is now the only deploy path.
          Path("Dockerfile.backend").write_text('''FROM python:3.12-slim AS builder\n\nWORKDIR /app\n\nRUN pip install --no-cache-dir uv\nCOPY backend/pyproject.toml backend/uv.lock ./backend/\nRUN UV_PROJECT_ENVIRONMENT=/opt/venv uv lock --check --project /app/backend \\\n    && UV_PROJECT_ENVIRONMENT=/opt/venv uv sync --frozen --no-dev --project /app/backend\n\nCOPY . .\n\nFROM python:3.12-slim\nWORKDIR /app\nCOPY --from=builder /opt/venv /opt/venv\nCOPY --from=builder /app /app\nENV PATH=/opt/venv/bin:$PATH\nENV PYTHONPATH=/app\nENV PYTHONUNBUFFERED=1\nEXPOSE 8000\nHEALTHCHECK --interval=30s --timeout=5s --start-period=60s --retries=3 \\\n    CMD python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"\nCMD ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-date-header", "--ws-ping-interval", "20", "--ws-ping-timeout", "20"]\n''', encoding="utf-8")

          # Linux provisioning: keep the privileged migration secret outside the service EnvironmentFile.
          replace(
              "deploy/install.sh",
              'UPDATE_CONF="/etc/tradingagents/update.env"\n',
              'UPDATE_CONF="/etc/tradingagents/update.env"\nMIGRATION_ENV_FILE="/etc/tradingagents/migration.env"\n',
          )
          replace(
              "deploy/install.sh",
              '[ -f "$PROJECT_ROOT/backend/requirements.txt" ] || die "backend/requirements.txt not found — run from project root."\n',
              '[ -f "$PROJECT_ROOT/backend/pyproject.toml" ] || die "backend/pyproject.toml not found — run from project root."\n'
              '[ -f "$PROJECT_ROOT/backend/uv.lock" ] || die "backend/uv.lock not found — run uv lock before deployment."\n',
          )
          replace(
              "deploy/install.sh",
              '"$VENV/bin/pip" install --upgrade pip wheel >/dev/null\n'
              'info "Installing backend/requirements.txt (may take a few minutes)..."\n'
              '"$VENV/bin/pip" install -r "$PROJECT_ROOT/backend/requirements.txt"\n'
              'ok "Python dependencies installed."\n',
              '"$VENV/bin/pip" install --upgrade pip wheel uv >/dev/null\n'
              'info "Syncing backend dependencies from pyproject.toml + uv.lock..."\n'
              '(\n'
              '    cd "$PROJECT_ROOT/backend"\n'
              '    UV_PROJECT_ENVIRONMENT="$VENV" "$VENV/bin/uv" lock --check\n'
              '    UV_PROJECT_ENVIRONMENT="$VENV" "$VENV/bin/uv" sync --frozen --no-dev\n'
              ')\n'
              'ok "Frozen Python dependencies installed."\n',
          )
          replace(
              "deploy/install.sh",
              '    {\n        printf "SECRET_KEY=\'%s\'\\n"          "$SECRET_KEY"\n',
              '    {\n        printf "ENVIRONMENT=\'production\'\\n"\n'
              '        printf "RLS_STRICT_MODE=\'true\'\\n"\n'
              '        printf "SECRET_KEY=\'%s\'\\n"          "$SECRET_KEY"\n',
          )
          replace(
              "deploy/install.sh",
              'fi\n\n# Read DB credentials from .env for Postgres setup\n',
              'fi\n\n'
              '# Installer-managed systemd deployments are production and RLS fail-closed.\n'
              'if grep -q "^ENVIRONMENT=" "$ENV_FILE"; then\n'
              '    sed -i "s/^ENVIRONMENT=.*/ENVIRONMENT=production/" "$ENV_FILE"\n'
              'else\n'
              '    printf "\\nENVIRONMENT=production\\n" >> "$ENV_FILE"\n'
              'fi\n'
              'if grep -q "^RLS_STRICT_MODE=" "$ENV_FILE"; then\n'
              '    sed -i "s/^RLS_STRICT_MODE=.*/RLS_STRICT_MODE=true/" "$ENV_FILE"\n'
              'else\n'
              '    printf "RLS_STRICT_MODE=true\\n" >> "$ENV_FILE"\n'
              'fi\n\n'
              '# Read DB credentials from .env for Postgres setup\n',
          )
          migration_block = '''\n# ── 6b. Separate migration/runtime database roles + migrate ─────────────────\nif [ "$SKIP_DB" = 1 ]; then\n    [ -n "${MIGRATION_DATABASE_URL:-}" ] || die "SKIP_DB=1 requires MIGRATION_DATABASE_URL in the installer environment; it is never stored in the app .env."\n    install -d -m 700 "$(dirname "$MIGRATION_ENV_FILE")"\n    MIGRATION_DATABASE_URL="$MIGRATION_DATABASE_URL" "$PYTHON" - "$MIGRATION_ENV_FILE" <<'PY'\nimport os, shlex, sys\nfrom pathlib import Path\nPath(sys.argv[1]).write_text("MIGRATION_DATABASE_URL=" + shlex.quote(os.environ["MIGRATION_DATABASE_URL"]) + "\\n", encoding="utf-8")\nPY\n    chmod 600 "$MIGRATION_ENV_FILE"\nelse\n    DB_USER="$DB_USER" DB_PASS="$DB_PASS" DB_NAME="$DB_NAME" \\\n        MIGRATION_ENV_FILE="$MIGRATION_ENV_FILE" \\\n        bash "$PROJECT_ROOT/deploy/provision-postgres-roles.sh"\nfi\n\nset -a\n# shellcheck disable=SC1090\n. "$MIGRATION_ENV_FILE"\nset +a\n: "${MIGRATION_DATABASE_URL:?migration URL was not provisioned}"\ninfo "Applying Alembic migrations with the isolated migration role..."\nPYTHONPATH="$PROJECT_ROOT" "$VENV/bin/alembic" -c "$PROJECT_ROOT/backend/alembic.ini" upgrade head\nunset MIGRATION_DATABASE_URL\nok "Database migrations applied; runtime role remains non-owner/NOBYPASSRLS."\n\n'''
          replace("deploy/install.sh", "\n# ── File Ownership ─────────────────────────────────────────────────────────────\n", migration_block + "# ── File Ownership ─────────────────────────────────────────────────────────────\n")
          replace(
              "deploy/install.sh",
              'VENV=$VENV\nEOF\n',
              'VENV=$VENV\nMIGRATION_ENV_FILE=$MIGRATION_ENV_FILE\nEOF\n',
          )

          Path("deploy/provision-postgres-roles.sh").write_text(r'''#!/usr/bin/env bash
set -euo pipefail

[ "$(id -u)" -eq 0 ] || { echo "provision-postgres-roles.sh requires root" >&2; exit 1; }
: "${DB_USER:?missing DB_USER}"
: "${DB_PASS:?missing DB_PASS}"
: "${DB_NAME:?missing DB_NAME}"
MIGRATION_ENV_FILE="${MIGRATION_ENV_FILE:-/etc/tradingagents/migration.env}"
MIGRATOR_USER="${DB_MIGRATOR_USER:-${DB_USER}_migrator}"
[ "$MIGRATOR_USER" != "$DB_USER" ] || { echo "migration and runtime roles must differ" >&2; exit 1; }

if [ -f "$MIGRATION_ENV_FILE" ]; then
    read EXISTING_USER MIGRATOR_PASS EXISTING_DB < <(python3 - "$MIGRATION_ENV_FILE" <<'PY'
import sys, urllib.parse as u
from pathlib import Path
line = next((x for x in Path(sys.argv[1]).read_text().splitlines() if x.startswith("MIGRATION_DATABASE_URL=")), "")
raw = line.split("=", 1)[1].strip().strip("'\"") if line else ""
p = u.urlsplit(raw)
print(p.username or "", u.unquote(p.password or ""), (p.path or "/").lstrip("/"))
PY
)
    [ "$EXISTING_USER" = "$MIGRATOR_USER" ] || { echo "existing migration env uses unexpected role" >&2; exit 1; }
    [ "$EXISTING_DB" = "$DB_NAME" ] || { echo "existing migration env targets unexpected database" >&2; exit 1; }
else
    MIGRATOR_PASS="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
fi

psql_admin() { runuser -u postgres -- psql -d template1 -v ON_ERROR_STOP=1 "$@"; }
psql_admin -v runtime="$DB_USER" -v runtime_pw="$DB_PASS" -v migrator="$MIGRATOR_USER" -v migrator_pw="$MIGRATOR_PASS" <<'SQL'
SELECT format('CREATE ROLE %I LOGIN', :'migrator')
WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'migrator');
\gexec
SELECT format('ALTER ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS', :'migrator', :'migrator_pw');
\gexec
SELECT format('ALTER ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS', :'runtime', :'runtime_pw');
\gexec
SQL

psql_admin -v db="$DB_NAME" -v migrator="$MIGRATOR_USER" <<'SQL'
SELECT format('ALTER DATABASE %I OWNER TO %I', :'db', :'migrator');
\gexec
SQL

runuser -u postgres -- psql -d "$DB_NAME" -v ON_ERROR_STOP=1 -v runtime="$DB_USER" -v migrator="$MIGRATOR_USER" -v db="$DB_NAME" <<'SQL'
SELECT format('REASSIGN OWNED BY %I TO %I', :'runtime', :'migrator');
\gexec
SELECT format('ALTER SCHEMA public OWNER TO %I', :'migrator');
\gexec
REVOKE CREATE ON SCHEMA public FROM PUBLIC;
SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'db', :'runtime');
\gexec
SELECT format('GRANT USAGE ON SCHEMA public TO %I', :'runtime');
\gexec
SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO %I', :'runtime');
\gexec
SELECT format('GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO %I', :'runtime');
\gexec
SELECT format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I', :'migrator', :'runtime');
\gexec
SELECT format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO %I', :'migrator', :'runtime');
\gexec
SQL

install -d -m 700 "$(dirname "$MIGRATION_ENV_FILE")"
MIGRATOR_USER="$MIGRATOR_USER" MIGRATOR_PASS="$MIGRATOR_PASS" DB_NAME="$DB_NAME" python3 - "$MIGRATION_ENV_FILE" <<'PY'
import os, urllib.parse as u, sys
from pathlib import Path
user = u.quote(os.environ["MIGRATOR_USER"], safe="")
pw = u.quote(os.environ["MIGRATOR_PASS"], safe="")
db = u.quote(os.environ["DB_NAME"], safe="")
url = f"postgresql+asyncpg://{user}:{pw}@localhost:5432/{db}"
Path(sys.argv[1]).write_text(f"MIGRATION_DATABASE_URL='{url}'\n", encoding="utf-8")
PY
chmod 600 "$MIGRATION_ENV_FILE"
''', encoding="utf-8")
          Path("deploy/provision-postgres-roles.sh").chmod(0o755)

          # Updater inherits the root-only migration URL only for the Alembic subprocess.
          replace(
              "deploy/update.sh",
              'VENV="${VENV:-$PROJECT_ROOT/.venv}"\n\n',
              'VENV="${VENV:-$PROJECT_ROOT/.venv}"\n'
              'MIGRATION_ENV_FILE="${MIGRATION_ENV_FILE:-/etc/tradingagents/migration.env}"\n'
              '[ -r "$MIGRATION_ENV_FILE" ] || { echo "Missing migration credential file: $MIGRATION_ENV_FILE" >&2; exit 1; }\n'
              'set -a\n'
              '# shellcheck disable=SC1090\n'
              '. "$MIGRATION_ENV_FILE"\n'
              'set +a\n'
              ': "${MIGRATION_DATABASE_URL:?missing MIGRATION_DATABASE_URL}"\n\n',
          )
          replace(
              "deploy/update.sh",
              'run_user "$NEW_VENV/bin/python" -m pip install --upgrade pip wheel\n'
              'run_user "$NEW_VENV/bin/pip" install -r "$WORKTREE/backend/requirements.txt"\n'
              'run_user "$NEW_VENV/bin/python" -m compileall -q "$WORKTREE/backend"\n',
              'run_user "$NEW_VENV/bin/python" -m pip install --upgrade pip wheel uv\n'
              'run_user "$NEW_VENV/bin/uv" lock --check --project "$WORKTREE/backend"\n'
              'run_user env UV_PROJECT_ENVIRONMENT="$NEW_VENV" "$NEW_VENV/bin/uv" sync --frozen --no-dev --project "$WORKTREE/backend"\n'
              'run_user "$NEW_VENV/bin/python" -m compileall -q "$WORKTREE/backend"\n',
          )

          # Docker uses a superuser/migrator only in prepare+migrate one-shots; app containers get only runtime credentials.
          Path("deploy/docker-db-prepare.sh").write_text(r'''#!/bin/sh
set -eu
: "${PGHOST:?}"
: "${PGDATABASE:?}"
: "${PGUSER:?}"
: "${PGPASSWORD:?}"
: "${DB_RUNTIME_USER:?}"
: "${DB_RUNTIME_PASSWORD:?}"

psql -v ON_ERROR_STOP=1 -d postgres -v runtime="$DB_RUNTIME_USER" -v runtime_pw="$DB_RUNTIME_PASSWORD" <<'SQL'
SELECT format('CREATE ROLE %I LOGIN', :'runtime')
WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'runtime');
\gexec
SELECT format('ALTER ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS', :'runtime', :'runtime_pw');
\gexec
SQL

psql -v ON_ERROR_STOP=1 -d "$PGDATABASE" -v runtime="$DB_RUNTIME_USER" -v owner="$PGUSER" -v db="$PGDATABASE" <<'SQL'
REVOKE CREATE ON SCHEMA public FROM PUBLIC;
SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'db', :'runtime');
\gexec
SELECT format('GRANT USAGE ON SCHEMA public TO %I', :'runtime');
\gexec
SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO %I', :'runtime');
\gexec
SELECT format('GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO %I', :'runtime');
\gexec
SELECT format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I', :'owner', :'runtime');
\gexec
SELECT format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO %I', :'owner', :'runtime');
\gexec
SQL
''', encoding="utf-8")
          Path("deploy/docker-db-prepare.sh").chmod(0o755)

          compose = Path("docker-compose.yml").read_text(encoding="utf-8")
          marker = "\n  redis:\n"
          if marker not in compose:
              raise SystemExit("docker compose redis marker not found")
          compose_services = '''\n  db-prepare:\n    image: postgres:16-alpine\n    depends_on:\n      postgres:\n        condition: service_healthy\n    environment:\n      PGHOST: postgres\n      PGDATABASE: tradingagents\n      PGUSER: tradingagents\n      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}\n      DB_RUNTIME_USER: tradingagents_app\n      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Set DB_RUNTIME_PASSWORD in .env}\n    volumes:\n      - ./deploy/docker-db-prepare.sh:/usr/local/bin/docker-db-prepare.sh:ro\n    command: ["/bin/sh", "/usr/local/bin/docker-db-prepare.sh"]\n    networks:\n      - tradingagents-net\n\n  migrate:\n    build:\n      context: .\n      dockerfile: Dockerfile.backend\n    depends_on:\n      db-prepare:\n        condition: service_completed_successfully\n    environment:\n      ENVIRONMENT: development\n      DATABASE_URL: postgresql+asyncpg://tradingagents_app:${DB_RUNTIME_PASSWORD:?Set DB_RUNTIME_PASSWORD in .env}@postgres:5432/tradingagents\n      MIGRATION_DATABASE_URL: postgresql+asyncpg://tradingagents:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/tradingagents\n    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]\n    networks:\n      - tradingagents-net\n\n'''
          compose = compose.replace(marker, compose_services + "  redis:\n", 1)
          compose = compose.replace(
              '      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    env_file: .env\n    environment:\n      DATABASE_URL: postgresql+asyncpg://tradingagents:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/tradingagents\n',
              '      postgres:\n        condition: service_healthy\n      migrate:\n        condition: service_completed_successfully\n      redis:\n        condition: service_healthy\n    environment:\n      ENVIRONMENT: production\n      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}\n      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}\n      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}\n      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}\n      RLS_STRICT_MODE: "true"\n      DATABASE_URL: postgresql+asyncpg://tradingagents_app:${DB_RUNTIME_PASSWORD:?Set DB_RUNTIME_PASSWORD in .env}@postgres:5432/tradingagents\n',
              1,
          )
          compose = compose.replace(
              '      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    env_file: .env\n    environment:\n      DATABASE_URL: postgresql+asyncpg://tradingagents:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/tradingagents\n      REDIS_URL: redis://redis:6379/0\n',
              '      postgres:\n        condition: service_healthy\n      migrate:\n        condition: service_completed_successfully\n      redis:\n        condition: service_healthy\n    environment:\n      ENVIRONMENT: production\n      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}\n      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}\n      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}\n      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}\n      RLS_STRICT_MODE: "true"\n      DATABASE_URL: postgresql+asyncpg://tradingagents_app:${DB_RUNTIME_PASSWORD:?Set DB_RUNTIME_PASSWORD in .env}@postgres:5432/tradingagents\n      REDIS_URL: redis://redis:6379/0\n',
              1,
          )
          Path("docker-compose.yml").write_text(compose, encoding="utf-8")

          replace(
              ".env.docker",
              '# --- Database (single source for both PostgreSQL and backend) ---\n'
              '# python -c "import secrets; print(secrets.token_urlsafe(24))"\n'
              'DB_PASSWORD=replace-with-a-long-random-password\n',
              '# --- Database role separation ---\n'
              '# DB_PASSWORD belongs only to the PostgreSQL owner/migration service.\n'
              '# DB_RUNTIME_PASSWORD belongs to the non-owner/NOBYPASSRLS web+worker role.\n'
              '# python -c "import secrets; print(secrets.token_urlsafe(24))"\n'
              'DB_PASSWORD=replace-with-a-long-random-migration-password\n'
              'DB_RUNTIME_PASSWORD=replace-with-a-different-long-random-runtime-password\n',
          )

          # pyproject.toml + uv.lock are now the only dependency sources.
          for obsolete in ("backend/requirements.txt", "backend/scripts/export-requirements.sh"):
              p = Path(obsolete)
              if p.exists():
                  p.unlink()

          for doc in ("README.md", "backend/README.md", "docs/installation.md", "deploy/README.md", "docs/architecture/backend.md"):
              p = Path(doc)
              if not p.exists():
                  continue
              text = p.read_text(encoding="utf-8")
              text = text.replace("pip install -r backend/requirements.txt", "cd backend && uv sync --frozen")
              text = text.replace("pip install -r requirements.txt", "uv sync --frozen")
              text = text.replace("backend/requirements.txt", "backend/pyproject.toml + backend/uv.lock")
              text = text.replace("requirements.txt", "pyproject.toml + uv.lock")
              p.write_text(text, encoding="utf-8")

          # Replace the now-stale architecture notes with the final deployment contract.
          arch = Path("docs/architecture-integrations.md")
          text = arch.read_text(encoding="utf-8")
          start = text.index("## PostgreSQL RLS\n")
          obs = text.index("## Observability\n", start)
          rls = '''## PostgreSQL RLS\n\nAlembic enables tenant policies on application tables carrying `user_id`; authenticated requests set transaction-local `app.user_id` / `app.is_admin`.\n\nProduction is fail-closed. The web/worker connection must be a dedicated non-owner, `NOSUPERUSER`, `NOBYPASSRLS` role. `ENVIRONMENT=production` automatically makes the runtime-role validation strict.\n\nMigration credentials are deliberately excluded from the application `.env`/process. Linux deployment stores them root-only in `/etc/tradingagents/migration.env`; Docker exposes the owner credential only to the prepare/migrate one-shot services. Production web/worker startup never runs DDL: it verifies `alembic_version` is already at repository head and refuses to start otherwise.\n\n'''
          text = text[:start] + rls + text[obs:]
          dep = text.index("## Dependency locking\n")
          text = text[:dep] + '''## Dependency locking\n\n`backend/pyproject.toml` is the hand-edited manifest and `backend/uv.lock` is the resolver-generated lock. Production installs use only:\n\n```bash\ncd backend\nuv lock --check\nuv sync --frozen --no-dev\n```\n\n`requirements.txt` and its export script are removed, so there is no second dependency source to drift. Research and observability remain explicit non-default dependency groups recorded in the same lock.\n'''
          arch.write_text(text, encoding="utf-8")
          PY
      - name: Validate lock and Python
        run: |
          python -m pip install --upgrade uv
          cd backend
          uv lock --check
          uv sync --frozen
          uv run ruff check core/config.py core/database.py core/rls.py alembic/env.py
          uv run python -m compileall -q .
          uv run pytest tests/test_services/test_retry_authority.py tests/test_services/test_rls_role_validation.py
      - name: Validate deployment scripts
        run: |
          bash -n deploy/install.sh
          bash -n deploy/update.sh
          bash -n deploy/provision-postgres-roles.sh
          sh -n deploy/docker-db-prepare.sh
          grep -R "backend/requirements.txt" Dockerfile.backend deploy backend/scripts README.md backend/README.md docs/installation.md deploy/README.md docs/architecture/backend.md && exit 1 || true
      - name: Commit final architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish frozen dependencies and production RLS isolation"
          git push origin HEAD:agent/memory-strategy-stability
