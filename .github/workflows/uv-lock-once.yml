name: Generate uv lock once

on:
  push:
    branches:
      - agent/memory-strategy-stability
    paths:
      - .github/workflows/uv-lock-once.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/memory-strategy-stability
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Resolve lock
        working-directory: backend
        run: |
          uv lock
          uv lock --check
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already current"
            exit 0
          fi
          git commit -m "Generate uv lock"
          git push origin HEAD:agent/memory-strategy-stability
