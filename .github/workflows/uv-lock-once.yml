name: Finish architecture once

on:
  push:
    branches:
      - agent/memory-strategy-stability
    paths:
      - .github/workflows/uv-lock-once.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/memory-strategy-stability
      - name: Apply patches
        run: |
          python .github/finish_architecture.py
          python .github/fix_catalog.py
      - name: Validate lock and Python
        run: |
          python -m pip install --upgrade uv
          cd backend
          uv lock --check
          uv sync --frozen
          uv run ruff check core/config.py core/database.py core/rls.py core/catalog.py alembic/env.py tests/test_core/test_llm_catalog.py
          uv run python -m compileall -q .
          uv run pytest tests/test_services/test_retry_authority.py tests/test_services/test_rls_role_validation.py tests/test_core/test_llm_catalog.py
      - name: Validate deployment scripts
        run: |
          bash -n deploy/install.sh
          bash -n deploy/update.sh
          bash -n deploy/provision-postgres-roles.sh
          sh -n deploy/docker-db-prepare.sh
          if grep -R "backend/requirements.txt" Dockerfile.backend deploy backend/scripts README.md backend/README.md docs/installation.md deploy/README.md docs/architecture/backend.md; then exit 1; fi
          DB_PASSWORD=migration-test \
          DB_RUNTIME_PASSWORD=runtime-test \
          SECRET_KEY=secret-test \
          ADMIN_PASSWORD_HASH=hash-test \
          ENCRYPTION_KEY=key-test \
          CORS_ORIGINS='["http://localhost:5173"]' \
          METRICS_TOKEN=metrics-test \
          GRAFANA_ADMIN_PASSWORD=grafana-test \
          docker compose config >/dev/null
      - name: Commit final architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/finish_architecture.py .github/fix_catalog.py .github/workflows/uv-lock-once.yml
          git add -A
          git commit -m "Finish frozen dependencies and production RLS isolation"
          git push origin HEAD:agent/memory-strategy-stability
