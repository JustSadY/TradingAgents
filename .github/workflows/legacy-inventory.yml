name: Legacy inventory

on:
  push:
    branches:
      - agent/legacy-cleanup-pass4
    paths:
      - .github/workflows/legacy-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Legacy and compatibility markers
        shell: bash
        run: |
          echo '=== MARKERS ==='
          git grep -n -i -E '\b(legacy|compatib|deprecated|obsolete|retired|backward[- ]compat|old release|old schema)\b' -- \
            backend frontend docs deploy '*.md' \
            ':!backend/alembic/versions/**' \
            ':!backend/tests/**' \
            ':!backend/postgres_tests/**' \
            ':!frontend/src/**/__tests__/**' || true

      - name: Architecture boundary inventory
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          print('=== SERVICES IMPORTING API ===')
          for path in sorted(Path('backend/services').rglob('*.py')):
              try:
                  tree = ast.parse(path.read_text())
              except Exception:
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and (node.module or '').startswith('backend.api'):
                      print(f'{path}:{node.lineno}: from {node.module}')
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.startswith('backend.api'):
                              print(f'{path}:{node.lineno}: import {alias.name}')

          print('=== ROUTER SQL / ORM IMPORTS ===')
          for path in sorted(Path('backend/api').glob('*.py')):
              try:
                  tree = ast.parse(path.read_text())
              except Exception:
                  continue
              hits = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom):
                      module = node.module or ''
                      if module.startswith('sqlalchemy') or module.startswith('backend.models'):
                          hits.append((node.lineno, f'from {module} import ...'))
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.startswith('sqlalchemy') or alias.name.startswith('backend.models'):
                              hits.append((node.lineno, f'import {alias.name}'))
                  elif isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                      if isinstance(node.func.value, ast.Name) and node.func.value.id == 'db' and node.func.attr in {'execute','add','delete','flush','commit','rollback'}:
                          hits.append((node.lineno, f'db.{node.func.attr}(...)'))
              if hits:
                  print(path)
                  for line, desc in sorted(set(hits)):
                      print(f'  {line}: {desc}')
          PY

      - name: One-use wrapper candidates
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          roots = [Path('backend'), Path('frontend/src')]
          texts = {}
          for root in roots:
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.py', '.ts', '.tsx'}:
                      try:
                          texts[path] = path.read_text()
                      except UnicodeDecodeError:
                          pass
          corpus = '\n'.join(texts.values())

          print('=== PYTHON TOP-LEVEL SYMBOLS WITH <= 2 TEXT REFERENCES ===')
          for path, text in sorted(texts.items(), key=lambda item: str(item[0])):
              if path.suffix != '.py' or '/tests/' in f'/{path.as_posix()}/' or '/alembic/versions/' in f'/{path.as_posix()}/':
                  continue
              try:
                  tree = ast.parse(text)
              except Exception:
                  continue
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and not node.name.startswith('_'):
                      count = len(re.findall(rf'\b{re.escape(node.name)}\b', corpus))
                      if count <= 2:
                          print(f'{path}:{node.lineno}: {node.name} refs={count}')
          PY

      - name: Repository debris inventory
        shell: bash
        run: |
          echo '=== SUSPICIOUS FILENAMES ==='
          find . -type f \( \
            -iname '*legacy*' -o -iname '*old*' -o -iname '*backup*' -o \
            -iname '*.bak' -o -iname '*.orig' -o -iname '*.rej' -o -iname '*.patch' -o \
            -iname '*deprecated*' \
          \) -not -path './.git/*' | sort
