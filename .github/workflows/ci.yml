name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: tradingagents
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-asyncio
        pip install -r backend/requirements.txt

    - name: Run Ruff Lint check
      run: |
        ruff check backend/

    - name: Run Ruff Format check
      run: |
        ruff format --check backend/

    - name: Run Backend Tests
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tradingagents
        SECRET_KEY: test_secret_key_change_me_in_production
        ENCRYPTION_KEY: fP2S_N9xG9gK9pD3V3F9fT9gK9pD3V3F9fT9gK9pD3U=
        ADMIN_USERNAME: admin
      run: |
        cd backend
        pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Lint
      working-directory: frontend
      run: npm run lint

    - name: Test
      working-directory: frontend
      run: npm test

    - name: Build
      working-directory: frontend
      run: npm run build
