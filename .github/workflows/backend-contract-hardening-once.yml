name: Backend contract hardening once

on:
  push:
    branches:
      - tmp/backend-contract-hardening
    paths:
      - .github/workflows/backend-contract-hardening-once.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/backend-contract-hardening
          fetch-depth: 0
      - name: Apply backend-only B1-B4 patches
        run: |
          set -euo pipefail
          python .github/apply_b1_rls.py
          python .github/apply_b2_b3_meta_schema.py
          python .github/apply_b4_openapi.py
          python .github/apply_postgres_rls_tests.py
          python .github/fix_postgres_marker.py
          if ! git diff --quiet -- frontend; then
            echo "Frontend files changed by backend hardening; refusing."
            git diff --name-only -- frontend
            exit 1
          fi
          git diff --check
      - name: Run backend acceptance suite
        run: |
          set -euo pipefail
          cd backend
          python -m pip install --upgrade uv
          uv lock --check
          uv sync --frozen
          uv run ruff check . --fix
          uv run ruff check .
          uv run pyright
          uv run pytest -q
          uv run python scripts/export-openapi.py /tmp/openapi-a.json
          uv run python scripts/export-openapi.py /tmp/openapi-b.json
          cmp /tmp/openapi-a.json /tmp/openapi-b.json
      - name: Provision PostgreSQL migrator and non-owner runtime roles
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE migrator LOGIN PASSWORD 'migrator-test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_runtime LOGIN PASSWORD 'runtime-test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE tradingagents OWNER migrator;
          SQL
          psql -h 127.0.0.1 -U postgres -d tradingagents -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION vector;
          ALTER SCHEMA public OWNER TO migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT CONNECT ON DATABASE tradingagents TO app_runtime;
          GRANT USAGE ON SCHEMA public TO app_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE migrator IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO app_runtime;
          SQL
          cd backend
          export DATABASE_URL='postgresql+asyncpg://app_runtime:runtime-test@127.0.0.1:5432/tradingagents'
          export MIGRATION_DATABASE_URL='postgresql+asyncpg://migrator:migrator-test@127.0.0.1:5432/tradingagents'
          uv run alembic -c alembic.ini upgrade head
          test "$(uv run alembic -c alembic.ini heads | grep -c '(head)')" -eq 1
      - name: Run PostgreSQL RLS integration tests
        env:
          TEST_POSTGRES_RLS_URL: postgresql+asyncpg://app_runtime:runtime-test@127.0.0.1:5432/tradingagents
          TEST_POSTGRES_MIGRATION_URL: postgresql+asyncpg://migrator:migrator-test@127.0.0.1:5432/tradingagents
          DATABASE_URL: postgresql+asyncpg://app_runtime:runtime-test@127.0.0.1:5432/tradingagents
          ENVIRONMENT: test
          SECRET_KEY: postgres-rls-test-secret
          REDIS_URL: ""
          ANALYSIS_QUEUE_MODE: inline
        run: |
          set -euo pipefail
          cd backend
          uv run pytest -q -m postgres_rls postgres_tests
      - name: Publish one clean integration commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin integration/memory-maintenance-base
          expected='54ab148cc4b0b6609ddaf0e9884391ece49e59df'
          actual="$(git rev-parse origin/integration/memory-maintenance-base)"
          test "$actual" = "$expected" || { echo "Integration branch moved: $actual"; exit 1; }
          git rm .github/apply_b1_rls.py .github/apply_b2_b3_meta_schema.py .github/apply_b4_openapi.py .github/apply_postgres_rls_tests.py .github/fix_postgres_marker.py .github/workflows/backend-contract-hardening-once.yml
          git add backend
          if ! git diff --cached --quiet -- frontend; then
            echo "Frontend staged unexpectedly"; exit 1
          fi
          git reset --soft "$expected"
          git add -A
          if git diff --cached --name-only | grep '^frontend/'; then
            echo "Frontend would be included; refusing"; exit 1
          fi
          git commit -m "Harden RLS and backend API schema contracts"
          git push origin HEAD:integration/memory-maintenance-base
