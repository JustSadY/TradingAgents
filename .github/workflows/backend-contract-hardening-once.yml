name: Backend contract hardening once

on:
  push:
    branches:
      - tmp/backend-contract-hardening

permissions:
  contents: write

jobs:
  validate-exact-candidate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/backend-contract-hardening
          fetch-depth: 0

      - name: Materialize exact B1-B4 backend candidate
        run: |
          set -euo pipefail
          python .github/apply_b1_rls.py
          python .github/apply_b2_b3_meta_schema.py
          python .github/apply_b4_openapi.py
          python .github/apply_postgres_rls_tests.py
          python .github/fix_postgres_marker.py
          python .github/fix_hardening_compat.py
          python .github/fix_postgres_loop_scope.py
          exact="$(git rev-parse HEAD)"
          echo "EXACT_ACCEPTANCE_SHA=$exact" | tee -a "$GITHUB_ENV"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --check HEAD^..HEAD
          git diff --quiet 54ab148cc4b0b6609ddaf0e9884391ece49e59df HEAD -- frontend

      - name: Run exact-commit backend acceptance suite
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_ACCEPTANCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          cd backend
          python -m pip install --upgrade uv
          uv lock --check
          uv sync --frozen
          uv run ruff check .
          uv run pyright
          uv run pytest -q
          uv run python scripts/export-openapi.py /tmp/openapi-a.json
          uv run python scripts/export-openapi.py /tmp/openapi-b.json
          cmp /tmp/openapi-a.json /tmp/openapi-b.json
          cd ..
          test "$(git rev-parse HEAD)" = "$EXACT_ACCEPTANCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Provision clean PostgreSQL migrator and runtime roles
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_ACCEPTANCE_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE migrator LOGIN PASSWORD 'migrator-test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE app_runtime LOGIN PASSWORD 'runtime-test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE tradingagents OWNER migrator;
          SQL
          psql -h 127.0.0.1 -U postgres -d tradingagents -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION vector;
          ALTER SCHEMA public OWNER TO migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT CONNECT ON DATABASE tradingagents TO app_runtime;
          GRANT USAGE ON SCHEMA public TO app_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE migrator IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO app_runtime;
          SQL
          cd backend
          export DATABASE_URL='postgresql+asyncpg://app_runtime:runtime-test@127.0.0.1:5432/tradingagents'
          export MIGRATION_DATABASE_URL='postgresql+asyncpg://migrator:migrator-test@127.0.0.1:5432/tradingagents'
          uv run alembic -c alembic.ini upgrade head
          test "$(uv run alembic -c alembic.ini heads | grep -c '(head)')" -eq 1
          test "$(uv run alembic -c alembic.ini heads | awk '{print $1}')" = '8a90b2c3d4e5'

      - name: Run PostgreSQL RLS 8-of-8 acceptance
        env:
          TEST_POSTGRES_RLS_URL: postgresql+asyncpg://app_runtime:runtime-test@127.0.0.1:5432/tradingagents
          TEST_POSTGRES_MIGRATION_URL: postgresql+asyncpg://migrator:migrator-test@127.0.0.1:5432/tradingagents
          DATABASE_URL: postgresql+asyncpg://app_runtime:runtime-test@127.0.0.1:5432/tradingagents
          ENVIRONMENT: test
          SECRET_KEY: postgres-rls-test-secret
          REDIS_URL: ""
          ANALYSIS_QUEUE_MODE: inline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_ACCEPTANCE_SHA"
          cd backend
          uv run pytest -q -m postgres_rls postgres_tests

      - name: Verify candidate remained exact and backend-only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_ACCEPTANCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --quiet 54ab148cc4b0b6609ddaf0e9884391ece49e59df HEAD -- frontend
          grep -q 'down_revision: str | None = "7f8091a2b3c4"' backend/alembic/versions/20260814_0019-8a90b2c3d4e5_contextual_rls.py
          echo "VALIDATED_EXACT_ACCEPTANCE_SHA=$EXACT_ACCEPTANCE_SHA"
