name: Run portfolio annotation cutover

on:
  push:
    branches:
      - agent/legacy-cleanup-pass4
    paths:
      - .github/workflows/run-portfolio-annotation-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-cleanup-pass4
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply canonical decision transform
        run: python .github/scripts/remove_portfolio_annotation_fallback.py

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Reject execution and UI annotation fallbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          orchestrator = Path('backend/services/trading_orchestrator.py').read_text()
          if '_annotations(' in orchestrator or 'annotations.get("portfolio_decision")' in orchestrator:
              raise SystemExit('trading orchestrator still reads decision from chart annotations')
          if 'portfolio_decision_json' not in orchestrator:
              raise SystemExit('canonical portfolio decision reader is missing')

          share = Path('backend/api/share.py').read_text()
          if 'annotations.get("portfolio_decision")' in share:
              raise SystemExit('shared reports still read decision from chart annotations')
          if 'analysis.portfolio_decision_json' not in share:
              raise SystemExit('shared report does not expose canonical portfolio decision')

          frontend = '\n'.join(
              Path(path).read_text()
              for path in (
                  'frontend/src/analysis/portfolioDecision.ts',
                  'frontend/src/components/analysis/PortfolioDecisionCard.tsx',
                  'frontend/src/pages/Analysis.tsx',
                  'frontend/src/components/analysis/tabs/HistoryTab.tsx',
              )
          )
          if 'chartAnnotations' in frontend or 'activeChartAnnotations' in frontend:
              raise SystemExit('frontend decision reader still accepts chart annotation fallback')
          print('PORTFOLIO_ANNOTATION_DECISION_FALLBACK=0')
          PY

      - name: Run backend decision regressions
        run: |
          uv run --project backend pytest \
            backend/tests/test_services/test_trading_orchestrator_execution.py \
            backend/tests/test_api/test_share.py \
            backend/tests/test_ai_engine/test_single_execution_authority.py

      - name: Run backend lint
        run: |
          uv run --project backend ruff check \
            backend/services/trading_orchestrator.py \
            backend/api/share.py \
            backend/tests/test_services/test_trading_orchestrator_execution.py \
            backend/alembic/versions/20260816_0024-ef56a7b8c9d0_backfill_canonical_portfolio_decision.py

      - name: Verify Alembic has one head
        shell: bash
        run: |
          cd backend
          heads="$(uv run alembic heads | tee /dev/stderr | wc -l)"
          test "$heads" -eq 1

      - name: Run frontend decision regressions
        run: |
          npm --prefix frontend test -- \
            src/analysis/__tests__/portfolioDecision.test.ts \
            src/pages/__tests__/SharedReport.test.tsx

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Commit validated cutover
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend frontend
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No cutover changes to commit' >&2
            exit 1
          fi
          git commit -m 'Remove chart annotation decision fallback'
          git push origin HEAD:agent/legacy-cleanup-pass4
